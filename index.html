<style>
*{box-sizing:border-box;margin:0;padding:0}

  --gold:#F8E070;--gold2:#FFE890;--gold3:#D0A820;

  --red:#FF9090;--green:#70E0A0;--blue:#90C0FF;
  --border:rgba(248,224,112,0.22);
}
/* 初号機テーマ（紫×黄緑） */
:root[data-theme="eva01"] {
  --gold:#A0D860; --gold2:#B8F078; --gold3:#70A030;
  --black:#1A0B2E; --dark1:#22103C; --dark2:#2E1650; --dark3:#3B1D66;
  --dark4:#4A2580; --dark5:#5B309A;
  --text:#F4FFF0; --text2:#D0F0A0; --text3:#A0D860;
  --border:rgba(160,216,96,0.3);
}
  /* 2号機テーマ（赤×オレンジ、押え目） */
  :root[data-theme="eva02"] {
  --gold:#FF9A5C;
  --gold2:#FFB380;
  --gold3:#FF6A2A;

  --black:#1A0A08;
  --dark1:#24100C;
  --dark2:#2F1510;
  --dark3:#3C1A14;
  --dark4:#4A2018;
  --dark5:#5C281C;

  --text:#FFF6F2;
  --text2:#FFD2B8;
  --text3:#FF9A5C;

  --border:rgba(255,154,92,0.35);
}
  /* マーク6テーマ（黒×ダークレッド、沈黙） */
  :root[data-theme="mark6"] {
  --gold:#FF8C42;      /* オレンジ */
  --gold2:#FFB066;
  --gold3:#CC6A2A;

  --black:#05080F;
  --dark1:#0A1120;
  --dark2:#0F1A30;
  --dark3:#142340;
  --dark4:#1A2C55;

  --text:#EAF2FF;
  --text2:#A8C4FF;
  --text3:#FF8C42;

  --border:rgba(255,140,66,0.35);
}
body{font-family:'Noto Serif JP',serif;background:var(--black);color:var(--text);height:100vh;overflow:hidden;transition:background 0.3s;}

input,textarea,select{font-family:'Noto Serif JP',serif}
#eva-bg{position:fixed;inset:0;pointer-events:none;z-index:0;}

<body>
<canvas id="eva-bg"></canvas>
<div id="app-root"></div>
<script>
(function(){
  const c=document.getElementById('eva-bg');
  const ctx=c.getContext('2d');
  let W,H;
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  let t=0;
  window.kosTheme = localStorage.getItem('kos_theme') || 'default';
  window.kosBg = localStorage.getItem('kos_bgType') || 'classic';
  document.documentElement.setAttribute('data-theme', window.kosTheme);
 
  // ===== 宇宙背景データ（初期化時に一度だけ生成）=====
  // 星（通常）
  const STARS = Array.from({length:320},()=>({
    x: Math.random(),
    y: Math.random(),
    r: Math.random()*1.8+0.2,
    alpha: Math.random()*0.7+0.3,
    twinkle: Math.random()*Math.PI*2,
    twinkleSpeed: Math.random()*0.03+0.008,
    color: [
      'rgba(255,255,255,1)',
      'rgba(200,220,255,1)',
      'rgba(255,240,200,1)',
      'rgba(255,200,200,1)',
      'rgba(200,255,255,1)',
    ][Math.floor(Math.random()*5)]
  }));
  // 輝く大きな星
  const BIG_STARS = Array.from({length:18},()=>({
    x: Math.random(),
    y: Math.random(),
    r: Math.random()*3+2.5,
    alpha: Math.random()*0.5+0.5,
    twinkle: Math.random()*Math.PI*2,
    twinkleSpeed: Math.random()*0.025+0.005,
    color: [
      'rgba(255,255,255,1)',
      'rgba(180,210,255,1)',
      'rgba(255,230,180,1)',
    ][Math.floor(Math.random()*3)]
  }));
  // 惑星
  const PLANETS = [
    {x:0.72, y:0.14, r:38, hue:200, rings:true,  ringTilt:0.28, moons:1},
    {x:0.12, y:0.22, r:22, hue:30,  rings:false, ringTilt:0,    moons:0},
    {x:0.88, y:0.60, r:16, hue:160, rings:false, ringTilt:0,    moons:0},
    {x:0.25, y:0.78, r:28, hue:280, rings:true,  ringTilt:0.22, moons:0},
    {x:0.60, y:0.08, r:12, hue:50,  rings:false, ringTilt:0,    moons:0},
  ];
  // 星雲（nebula）- 比率で定義
  const NEBULAE = [
    {x:0.30, y:0.35, rxR:0.22, ryR:0.14, hue:260, alpha:0.07},
    {x:0.75, y:0.65, rxR:0.18, ryR:0.12, hue:180, alpha:0.06},
    {x:0.55, y:0.85, rxR:0.25, ryR:0.10, hue:320, alpha:0.05},
  ];
  // 天の川（帯状の星密集）
  const MILKYWAY = Array.from({length:200},()=>({
    x: Math.random(),
    y: Math.random()*0.6+0.1,
    r: Math.random()*1.2+0.1,
    alpha: Math.random()*0.35+0.05,
  }));
 
  function draw(){
    const isEva   = window.kosTheme === 'eva01';
    const isEva02 = window.kosTheme === 'eva02';
    const isMark6 = window.kosTheme === 'mark6';
    const cLine = isEva ? '#A0D860' : isEva02 ? '#E87040' : isMark6 ? '#440000' : '#E8C96A';
 
    ctx.clearRect(0,0,W,H);
    t+=0.003;
 
    // ===== クラシック（金色セフィロトの樹）=====
    if(window.kosBg === 'classic' || window.kosBg === 'default') {
      ctx.save();ctx.strokeStyle=cLine;ctx.lineWidth=0.6;ctx.globalAlpha=0.12;
      const hw=80,hh=hw*Math.sqrt(3)/2;
      for(let row=-1;row<H/hh+2;row++){for(let col=-1;col<W/hw+2;col++){
        const x=col*hw*1.5,y=row*hh*2+(col%2)*hh;ctx.beginPath();
        for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);ctx.lineTo(x+hw/2*Math.cos(a),y+hw/2*Math.sin(a));}
        ctx.closePath();ctx.stroke();
      }}ctx.restore();
      const cx=W/2,cy=H/2;
      const sephiroth=[[cx,cy-H*0.38],[cx-W*0.10,cy-H*0.22],[cx+W*0.10,cy-H*0.22],[cx-W*0.10,cy-H*0.06],[cx+W*0.10,cy-H*0.06],[cx,cy+H*0.04],[cx-W*0.10,cy+H*0.16],[cx+W*0.10,cy+H*0.16],[cx,cy+H*0.28],[cx,cy+H*0.42]];
      const paths=[[0,1],[0,2],[1,2],[1,3],[2,4],[1,5],[2,5],[3,4],[3,5],[4,5],[3,6],[4,7],[5,6],[5,7],[5,8],[6,7],[6,8],[7,8],[8,9]];
      ctx.save();
      paths.forEach(([a,b],pi)=>{
        const phase=t*2+pi*0.4,prog=(Math.sin(phase)+1)/2;
        const ax=sephiroth[a][0],ay=sephiroth[a][1],bx=sephiroth[b][0],by=sephiroth[b][1];
        const gx=ax+(bx-ax)*prog,gy=ay+(by-ay)*prog;
        ctx.strokeStyle='#E8C96A';ctx.lineWidth=0.5;ctx.globalAlpha=0.18+0.07*Math.sin(phase);
        ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
        ctx.beginPath();ctx.arc(gx,gy,2.5,0,Math.PI*2);ctx.fillStyle='#FFE890';
        ctx.globalAlpha=0.55*Math.sin(phase+0.5);ctx.fill();
      });ctx.restore();
      ctx.save();sephiroth.forEach(([x,y],i)=>{
        const pulse=Math.sin(t*2.5+i*0.8),r=3+1.5*pulse;
        ctx.globalAlpha=0.3+0.15*pulse;ctx.fillStyle='#F8E070';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=0.08+0.05*pulse;ctx.strokeStyle='#FFE890';ctx.lineWidth=8+4*pulse;
        ctx.beginPath();ctx.arc(x,y,r+4,0,Math.PI*2);ctx.stroke();
      });ctx.restore();
      ctx.save();[320,220,130,60,20].forEach((r,i)=>{
        const rot=t*(i%2===0?1:-1)*0.15;
        ctx.globalAlpha=0.12+0.04*Math.sin(t+i);ctx.strokeStyle='#E8C96A';ctx.lineWidth=i===0?1.2:0.6;
        ctx.beginPath();ctx.arc(W/2,H/2,r,0,Math.PI*2);ctx.stroke();
        if(i<3){ctx.save();ctx.translate(W/2,H/2);ctx.rotate(rot);ctx.globalAlpha=0.08;ctx.setLineDash([8,r*0.3]);
        ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
      });ctx.restore();
      ctx.save();ctx.translate(W/2,H/2);ctx.rotate(t*0.08);ctx.strokeStyle='#F8E070';ctx.lineWidth=0.8;ctx.globalAlpha=0.12;
      [[0,2,4],[1,3,5]].forEach(idx=>{ctx.beginPath();idx.forEach((k,i)=>{const a=Math.PI/3*k-Math.PI/2;const px=100*Math.cos(a),py=100*Math.sin(a);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});ctx.closePath();ctx.stroke();});ctx.restore();
      ctx.save();ctx.globalAlpha=0.08;ctx.lineWidth=0.8;ctx.strokeStyle='#E8C96A';
      [[0,0,W,H],[W,0,0,H],[W/2,0,W/2,H],[0,H/2,W,H/2]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});ctx.restore();
      ctx.save();ctx.globalAlpha=0.06;ctx.lineWidth=0.4;ctx.setLineDash([3,9]);ctx.strokeStyle='#E8C96A';
      [H*0.17,H*0.33,H*0.67,H*0.83].forEach(y=>{ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();});
      [W*0.17,W*0.33,W*0.67,W*0.83].forEach(x=>{ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();});
      ctx.setLineDash([]);ctx.restore();
      ctx.save();ctx.translate(W/2,H/2);ctx.rotate(t*0.04);ctx.globalAlpha=0.08;ctx.lineWidth=0.9;ctx.strokeStyle='#FFE890';
      [[0,-160,160,false],[0,160,160,true]].forEach(([ox,oy,r,inv])=>{
        ctx.beginPath();for(let i=0;i<3;i++){const a=Math.PI/180*(120*i+(inv?180:270));ctx.lineTo(ox+r*Math.cos(a),oy+r*Math.sin(a));}
        ctx.closePath();ctx.stroke();
      });ctx.restore();
      ctx.save();ctx.globalAlpha=0.3+0.15*Math.sin(t*1.5);ctx.lineWidth=1;ctx.strokeStyle='#E8C96A';
      [[0,0,160,0,0,160],[W,0,W-160,0,W,160],[0,H,160,H,0,H-160],[W,H,W-160,H,W,H-160]].forEach(([x1,y1,x2,y2,x3,y3])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.stroke();});ctx.restore();
      ctx.save();const scanY=(t*80)%H;const scanGrad=ctx.createLinearGradient(0,scanY-40,0,scanY+40);
      scanGrad.addColorStop(0,'rgba(248,224,112,0)');scanGrad.addColorStop(0.5,'rgba(248,224,112,0.04)');scanGrad.addColorStop(1,'rgba(248,224,112,0)');
      ctx.fillStyle=scanGrad;ctx.fillRect(0,scanY-40,W,80);ctx.restore();
    }
 
    // ===== ロンギヌスの槍 =====
    if(window.kosBg === 'lance'){
      const time = Date.now();
      const pulse = 1 + Math.sin(time/600)*0.03;
      const cx = W/2, cy = H/2;
 
      // -----------------------------------------------
      // 暗い背景（地獄の門・赤黒）
      // -----------------------------------------------
      ctx.fillStyle='rgba(3,0,0,1)';
      ctx.fillRect(0,0,W,H);
 
      ctx.save();
      ctx.translate(cx, cy);
 
      // 中心から広がる暗赤グラデ
      const bgGrad=ctx.createRadialGradient(0,0,0,0,0,Math.max(W,H)*0.85);
      bgGrad.addColorStop(0,'rgba(90,8,8,1)');
      bgGrad.addColorStop(0.3,'rgba(55,4,4,1)');
      bgGrad.addColorStop(0.6,'rgba(22,2,2,1)');
      bgGrad.addColorStop(1,'rgba(3,0,0,1)');
      ctx.globalAlpha=1;ctx.fillStyle=bgGrad;
      ctx.beginPath();ctx.arc(0,0,Math.max(W,H)*0.85,0,Math.PI*2);ctx.fill();
 
      // 渦巻き放射線（周回）
      const numLines=60;
      for(let i=0;i<numLines;i++){
        const baseAngle=(Math.PI*2/numLines)*i;
        const angle=baseAngle+t*0.4+Math.sin(baseAngle*3)*0.3;
        const len=Math.max(W,H)*(0.5+0.35*Math.abs(Math.cos(baseAngle*2)));
        const alpha=0.12+0.07*Math.abs(Math.sin(baseAngle*4+t));
        const lineGrad=ctx.createLinearGradient(0,0,Math.cos(angle)*len,Math.sin(angle)*len);
        lineGrad.addColorStop(0,'rgba(200,20,20,0)');
        lineGrad.addColorStop(0.25,`rgba(180,12,12,${alpha*2.5})`);
        lineGrad.addColorStop(0.65,`rgba(120,6,6,${alpha})`);
        lineGrad.addColorStop(1,'rgba(20,0,0,0)');
        ctx.globalAlpha=1;ctx.strokeStyle=lineGrad;
        ctx.lineWidth=1.5+Math.sin(baseAngle*5)*0.8;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(angle)*len,Math.sin(angle)*len);ctx.stroke();
      }
 
      // 周回する楕円同心円
      for(let ring=0;ring<14;ring++){
        const r=(ring+1)*Math.max(W,H)*0.068;
        const rot=t*(ring%2===0?0.09:-0.07)*(1+ring*0.12);
        const scaleX=1.0+ring*0.045;
        const scaleY=0.52-ring*0.008;
        const alpha=0.18-ring*0.009;
        if(alpha<=0) continue;
        ctx.save();ctx.rotate(rot);ctx.scale(scaleX,scaleY);
        ctx.globalAlpha=alpha;
        ctx.strokeStyle=ring<7
          ?`rgba(220,${18+ring*6},${8+ring*3},1)`
          :`rgba(130,${8+ring*3},4,1)`;
        ctx.lineWidth=ring===0?3:1.4;
        ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
        ctx.restore();
      }
 
      // 中央コア（青白→紫発光）
      const coreR=Math.min(W,H)*0.08;
      for(let col=0;col<14;col++){
        const cx2=(col-6.5)*coreR*0.17;
        const ch=coreR*(1.3+0.3*Math.sin(time/300+col));
        const colGrad=ctx.createLinearGradient(cx2,-ch,cx2,ch*0.3);
        colGrad.addColorStop(0,'rgba(200,220,255,0)');
        colGrad.addColorStop(0.2,`rgba(180,200,255,${0.18+0.08*Math.sin(time/200+col)})`);
        colGrad.addColorStop(0.6,`rgba(140,80,220,${0.22+0.06*Math.sin(time/400+col)})`);
        colGrad.addColorStop(1,'rgba(100,20,160,0)');
        ctx.globalAlpha=1;ctx.fillStyle=colGrad;
        ctx.fillRect(cx2-coreR*0.08,-ch,coreR*0.16,ch*1.3);
      }
      const cg=ctx.createRadialGradient(0,0,0,0,0,coreR*1.3);
      cg.addColorStop(0,'rgba(245,245,255,0.95)');
      cg.addColorStop(0.15,'rgba(180,160,255,0.75)');
      cg.addColorStop(0.4,'rgba(120,60,200,0.45)');
      cg.addColorStop(0.7,'rgba(80,10,120,0.18)');
      cg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=0.8+0.15*Math.sin(time/350);
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,coreR*1.3,0,Math.PI*2);ctx.fill();
 
      // 天使の羽紋章
      const wingAlpha=0.20+0.06*Math.sin(time/700);
      for(let side=-1;side<=1;side+=2){
        ctx.save();ctx.scale(side,1);
        for(let w=0;w<10;w++){
          const wa=0.1+(w/10)*Math.PI*0.75;
          const wlen=coreR*(2.4+w*0.3);
          const wx=Math.cos(wa)*wlen,wy=Math.sin(wa)*wlen*0.5;
          ctx.globalAlpha=wingAlpha*(1-w*0.07);
          ctx.strokeStyle='rgba(255,230,200,0.9)';
          ctx.lineWidth=1.6-w*0.1;
          ctx.beginPath();ctx.moveTo(coreR*0.3,0);ctx.quadraticCurveTo(wx*0.5,wy*0.4,wx,wy);ctx.stroke();
        }
        ctx.restore();
      }
      ctx.globalAlpha=0.22;ctx.strokeStyle='rgba(200,60,60,0.9)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(0,0,coreR*2.0,0,Math.PI*2);ctx.stroke();
      ctx.restore();
 
      // -----------------------------------------------
      // 槍本体（右上→左下・画面端から端）
      // -----------------------------------------------
      const angle = Math.PI * 0.22;
      const dx = Math.cos(angle), dy = Math.sin(angle);
 
      // 画面端交点
      let tMax = Infinity;
      if(dx>0) tMax=Math.min(tMax,(W-cx)/dx);
      if(dx<0) tMax=Math.min(tMax,-cx/dx);
      if(dy>0) tMax=Math.min(tMax,(H-cy)/dy);
      if(dy<0) tMax=Math.min(tMax,-cy/dy);
 
      // 先端余白：Y字二股が画面内に収まるだけ確保
      const forkLen   = Math.min(W,H) * 0.18;  // 二股の長さ（画面サイズ比）
      const forkSpread= Math.min(W,H) * 0.12;  // 二股の開き幅
      const tipMargin = forkLen + 20;           // 先端余白
 
      const tipEnd  = tMax - tipMargin;  // 槍本体の先端
      const tailEnd = -tMax;             // 槍の末端
 
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
 
      // 外側紫グロー
      const glowGrad=ctx.createLinearGradient(tailEnd,0,tMax,0);
      glowGrad.addColorStop(0,'rgba(120,0,180,0)');
      glowGrad.addColorStop(0.08,'rgba(160,0,240,0.25)');
      glowGrad.addColorStop(0.5,'rgba(200,30,255,0.38)');
      glowGrad.addColorStop(0.92,'rgba(160,0,240,0.25)');
      glowGrad.addColorStop(1,'rgba(120,0,180,0)');
      ctx.globalAlpha=0.75+0.15*Math.sin(time/500);
      ctx.fillStyle=glowGrad;
      ctx.fillRect(tailEnd,-90,(tMax-tailEnd),180);
 
      // 槍の芯（極太・赤）
      ctx.globalAlpha=0.95;
      ctx.strokeStyle='#C01020';
      ctx.lineWidth=48*pulse;  // さらに太く
      ctx.lineCap='butt';
      ctx.shadowBlur=50;ctx.shadowColor='#FF1840';
      ctx.beginPath();ctx.moveTo(tailEnd,0);ctx.lineTo(tipEnd,0);ctx.stroke();
 
      // 中央ハイライト（明るい赤）
      ctx.globalAlpha=0.5;
      ctx.strokeStyle='rgba(255,120,130,0.9)';
      ctx.lineWidth=12*pulse;ctx.shadowBlur=15;ctx.shadowColor='#FFAAAA';
      ctx.beginPath();ctx.moveTo(tailEnd,0);ctx.lineTo(tipEnd,0);ctx.stroke();
 
      // 二重螺旋（軸付き）
      ctx.globalAlpha=0.45;
      ctx.strokeStyle='rgba(255,60,60,0.6)';
      ctx.lineWidth=2;ctx.shadowBlur=5;
      ctx.setLineDash([14,7]);
      ctx.beginPath();ctx.moveTo(tailEnd,0);ctx.lineTo(tipEnd,0);ctx.stroke();
      ctx.setLineDash([]);
 
      const amplitude=32,freq=0.020,rotSpeed=0.0022;
 
      ctx.shadowBlur=22;ctx.shadowColor='#FF40A0';
      ctx.strokeStyle='#FF1838';ctx.lineWidth=10*pulse;ctx.globalAlpha=0.95;
      ctx.beginPath();
      for(let x=tailEnd;x<=tipEnd;x+=3){
        const y=Math.sin(x*freq+time*rotSpeed)*amplitude*pulse;
        x===Math.ceil(tailEnd)?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.beginPath();
      for(let x=tailEnd;x<=tipEnd;x+=3){
        const y=Math.sin(x*freq+time*rotSpeed+Math.PI)*amplitude*pulse;
        x===Math.ceil(tailEnd)?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
 
      // 連結横線
      const step2=(tipEnd-tailEnd)/55;
      for(let x=tailEnd;x<=tipEnd;x+=step2){
        const y1=Math.sin(x*freq+time*rotSpeed)*amplitude*pulse;
        const y2=Math.sin(x*freq+time*rotSpeed+Math.PI)*amplitude*pulse;
        const dist=Math.abs(y1-y2);
        ctx.strokeStyle=`rgba(255,100,150,${0.28+0.32*(dist/(amplitude*2))})`;
        ctx.lineWidth=1.8+2*(dist/(amplitude*2));
        ctx.globalAlpha=0.5;ctx.shadowBlur=4;
        ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke();
      }
 
      // -----------------------------------------------
      // Y字先端（画像参照：根元1本→大きく開く2股）
      // -----------------------------------------------
      // 根元から先端に向かって太さが変化するY字
 
      // 二股A（上方向）の太い幹
      ctx.globalAlpha=1;
      ctx.lineCap='round';
      ctx.shadowBlur=45;ctx.shadowColor='#FF2050';
 
      // 外側グロー（二股A）
      ctx.strokeStyle='rgba(255,40,80,0.4)';
      ctx.lineWidth=58*pulse;
      ctx.beginPath();
      ctx.moveTo(tipEnd,0);
      ctx.quadraticCurveTo(
        tipEnd+forkLen*0.42, -forkSpread*0.55,
        tipEnd+forkLen,      -forkSpread
      );
      ctx.stroke();
 
      // 外側グロー（二股B）
      ctx.beginPath();
      ctx.moveTo(tipEnd,0);
      ctx.quadraticCurveTo(
        tipEnd+forkLen*0.42,  forkSpread*0.55,
        tipEnd+forkLen,       forkSpread
      );
      ctx.stroke();
 
      // 芯（二股A）
      ctx.strokeStyle='#CC1020';
      ctx.lineWidth=44*pulse;
      ctx.shadowBlur=35;
      ctx.beginPath();
      ctx.moveTo(tipEnd,0);
      ctx.quadraticCurveTo(
        tipEnd+forkLen*0.42, -forkSpread*0.55,
        tipEnd+forkLen,      -forkSpread
      );
      ctx.stroke();
 
      // 芯（二股B）
      ctx.beginPath();
      ctx.moveTo(tipEnd,0);
      ctx.quadraticCurveTo(
        tipEnd+forkLen*0.42,  forkSpread*0.55,
        tipEnd+forkLen,       forkSpread
      );
      ctx.stroke();
 
      // ハイライト（二股A）
      ctx.strokeStyle='rgba(255,160,170,0.75)';
      ctx.lineWidth=12*pulse;ctx.shadowBlur=12;ctx.shadowColor='#FFCCCC';
      ctx.beginPath();
      ctx.moveTo(tipEnd,0);
      ctx.quadraticCurveTo(
        tipEnd+forkLen*0.42, -forkSpread*0.55,
        tipEnd+forkLen,      -forkSpread
      );
      ctx.stroke();
 
      // ハイライト（二股B）
      ctx.beginPath();
      ctx.moveTo(tipEnd,0);
      ctx.quadraticCurveTo(
        tipEnd+forkLen*0.42,  forkSpread*0.55,
        tipEnd+forkLen,       forkSpread
      );
      ctx.stroke();
 
      // 先端の鋭い尖り（上）
      ctx.strokeStyle='rgba(255,230,230,0.98)';
      ctx.lineWidth=6;ctx.shadowBlur=14;ctx.shadowColor='#FFEEEE';
      ctx.beginPath();
      ctx.moveTo(tipEnd+forkLen-10, -forkSpread+forkSpread*0.15);
      ctx.lineTo(tipEnd+forkLen+forkLen*0.15, -forkSpread-forkSpread*0.18);
      ctx.lineTo(tipEnd+forkLen+forkLen*0.10, -forkSpread+forkSpread*0.22);
      ctx.stroke();
 
      // 先端の鋭い尖り（下）
      ctx.beginPath();
      ctx.moveTo(tipEnd+forkLen-10,  forkSpread-forkSpread*0.15);
      ctx.lineTo(tipEnd+forkLen+forkLen*0.15,  forkSpread+forkSpread*0.18);
      ctx.lineTo(tipEnd+forkLen+forkLen*0.10,  forkSpread-forkSpread*0.22);
      ctx.stroke();
 
      ctx.restore();
    }
 
    // ===== セフィロトの樹（宇宙背景・虹色）=====
    if(window.kosBg === 'sephiroth'){
      const time=Date.now();
      const hue=(time/50)%360;
 
      // ---- 宇宙背景 ----
      // 深宇宙グラデ（黒→深紺→深紫）
      const spaceGrad=ctx.createRadialGradient(W*0.5,H*0.3,0,W*0.5,H*0.5,Math.max(W,H)*0.85);
      spaceGrad.addColorStop(0,'rgba(8,5,25,1)');
      spaceGrad.addColorStop(0.35,'rgba(4,3,18,1)');
      spaceGrad.addColorStop(0.7,'rgba(2,1,10,1)');
      spaceGrad.addColorStop(1,'rgba(0,0,5,1)');
      ctx.globalAlpha=1;ctx.fillStyle=spaceGrad;ctx.fillRect(0,0,W,H);
 
      // 星雲（nebula・ふわっとした色彩）
      NEBULAE.forEach(nb=>{
        ctx.save();
        const rx=nb.rxR*W, ry=nb.ryR*H;
        const ng=ctx.createRadialGradient(nb.x*W,nb.y*H,0,nb.x*W,nb.y*H,rx);
        ng.addColorStop(0,`hsla(${nb.hue},80%,60%,${nb.alpha*2})`);
        ng.addColorStop(0.4,`hsla(${nb.hue+30},70%,50%,${nb.alpha})`);
        ng.addColorStop(1,'rgba(0,0,0,0)');
        ctx.globalAlpha=1;ctx.fillStyle=ng;
        ctx.beginPath();ctx.ellipse(nb.x*W,nb.y*H,rx,ry,0.3,0,Math.PI*2);ctx.fill();
        ctx.restore();
      });
 
      // 天の川（帯状）
      ctx.save();
      ctx.translate(W*0.5,H*0.5);
      ctx.rotate(-0.35);
      ctx.translate(-W*0.5,-H*0.5);
      MILKYWAY.forEach(s=>{
        ctx.globalAlpha=s.alpha;
        ctx.fillStyle=`rgba(200,210,255,1)`;
        ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();
      });
      ctx.restore();
 
      // 通常の星（瞬き）
      STARS.forEach(s=>{
        s.twinkle+=s.twinkleSpeed;
        const a=s.alpha*(0.55+0.45*Math.sin(s.twinkle));
        ctx.globalAlpha=a;
        ctx.fillStyle=s.color;
        ctx.shadowBlur=s.r>1.2?6:0;
        ctx.shadowColor=s.color;
        ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();
      });
 
      // 輝く大きな星（十字光芒付き）
      BIG_STARS.forEach(s=>{
        s.twinkle+=s.twinkleSpeed;
        const a=s.alpha*(0.6+0.4*Math.sin(s.twinkle));
        const sx=s.x*W, sy=s.y*H;
        // グロー
        const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,s.r*5);
        sg.addColorStop(0,s.color.replace('1)','0.7)'));
        sg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.globalAlpha=a*0.6;ctx.fillStyle=sg;
        ctx.beginPath();ctx.arc(sx,sy,s.r*5,0,Math.PI*2);ctx.fill();
        // 本体
        ctx.globalAlpha=a;ctx.fillStyle=s.color;
        ctx.shadowBlur=12;ctx.shadowColor=s.color;
        ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);ctx.fill();
        // 十字光芒
        const rayLen=s.r*12;
        ctx.globalAlpha=a*0.5;
        ctx.strokeStyle=s.color;ctx.lineWidth=0.7;ctx.shadowBlur=4;
        [[0,1],[1,0],[0.7,0.7],[-0.7,0.7]].forEach(([dx2,dy2])=>{
          ctx.beginPath();ctx.moveTo(sx-dx2*rayLen,sy-dy2*rayLen);ctx.lineTo(sx+dx2*rayLen,sy+dy2*rayLen);ctx.stroke();
        });
      });
      ctx.shadowBlur=0;
 
      // 惑星
      PLANETS.forEach(p=>{
        const px=p.x*W, py=p.y*H;
        ctx.save();
        ctx.translate(px,py);
 
        // リング（後ろ半分を先に描く）
        if(p.rings){
          ctx.save();
          ctx.rotate(p.ringTilt);
          ctx.scale(1,0.3);
          ctx.strokeStyle=`hsla(${p.hue+40},60%,70%,0.35)`;
          ctx.lineWidth=p.r*0.7;
          ctx.globalAlpha=0.4;
          ctx.beginPath();ctx.arc(0,0,p.r*1.9,Math.PI,Math.PI*2);ctx.stroke();
          ctx.restore();
        }
 
        // 惑星本体
        const pg=ctx.createRadialGradient(-p.r*0.3,-p.r*0.3,p.r*0.1,0,0,p.r);
        pg.addColorStop(0,`hsl(${p.hue},70%,80%)`);
        pg.addColorStop(0.5,`hsl(${p.hue},60%,50%)`);
        pg.addColorStop(1,`hsl(${p.hue},40%,20%)`);
        ctx.globalAlpha=0.92;ctx.fillStyle=pg;
        ctx.shadowBlur=p.r*1.5;ctx.shadowColor=`hsla(${p.hue},70%,60%,0.5)`;
        ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
 
        // 大気光（縁取り）
        const atmG=ctx.createRadialGradient(0,0,p.r*0.85,0,0,p.r*1.15);
        atmG.addColorStop(0,'rgba(0,0,0,0)');
        atmG.addColorStop(0.6,`hsla(${p.hue},80%,65%,0.12)`);
        atmG.addColorStop(1,'rgba(0,0,0,0)');
        ctx.globalAlpha=0.9;ctx.fillStyle=atmG;
        ctx.beginPath();ctx.arc(0,0,p.r*1.15,0,Math.PI*2);ctx.fill();
 
        // リング前半分
        if(p.rings){
          ctx.save();
          ctx.rotate(p.ringTilt);
          ctx.scale(1,0.3);
          ctx.strokeStyle=`hsla(${p.hue+40},60%,70%,0.5)`;
          ctx.lineWidth=p.r*0.7;
          ctx.globalAlpha=0.5;
          ctx.beginPath();ctx.arc(0,0,p.r*1.9,0,Math.PI);ctx.stroke();
          ctx.restore();
        }
 
        // 衛星（月）
        if(p.moons>0){
          const moonAngle=t*0.8;
          const moonR=p.r*0.22;
          const moonDist=p.r*2.2;
          const mx=Math.cos(moonAngle)*moonDist;
          const my=Math.sin(moonAngle)*moonDist*0.55;
          const moonG=ctx.createRadialGradient(mx-moonR*0.3,my-moonR*0.3,moonR*0.1,mx,my,moonR);
          moonG.addColorStop(0,'rgba(220,220,220,1)');
          moonG.addColorStop(1,'rgba(100,100,110,1)');
          ctx.globalAlpha=0.85;ctx.fillStyle=moonG;ctx.shadowBlur=4;ctx.shadowColor='rgba(200,200,255,0.5)';
          ctx.beginPath();ctx.arc(mx,my,moonR,0,Math.PI*2);ctx.fill();
        }
 
        ctx.restore();
      });
 
      // 流れ星（ランダムに出現）
      if(Math.sin(t*7)*Math.sin(t*13)>0.92){
        const ssx=(Math.sin(t*5)*0.5+0.5)*W;
        const ssy=(Math.sin(t*3)*0.3+0.1)*H;
        const ssLen=W*0.08;
        const ssAngle=Math.PI*0.3;
        const ssGrad=ctx.createLinearGradient(ssx,ssy,ssx+Math.cos(ssAngle)*ssLen,ssy+Math.sin(ssAngle)*ssLen);
        ssGrad.addColorStop(0,'rgba(255,255,255,0.9)');
        ssGrad.addColorStop(1,'rgba(255,255,255,0)');
        ctx.globalAlpha=0.85;ctx.strokeStyle=ssGrad;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(ssx,ssy);ctx.lineTo(ssx+Math.cos(ssAngle)*ssLen,ssy+Math.sin(ssAngle)*ssLen);ctx.stroke();
      }
 
      // セフィロトの樹本体
      const marginX=W*0.10,marginY=H*0.03;
      const usableW=W-marginX*2,usableH=H-marginY*2;
      const nodeDef=[
        [0.5,0.02],[0.22,0.16],[0.78,0.16],
        [0.18,0.38],[0.82,0.38],[0.5,0.50],
        [0.18,0.65],[0.82,0.65],[0.5,0.80],[0.5,0.97]
      ];
      const nodes=nodeDef.map(([nx,ny])=>[marginX+nx*usableW,marginY+ny*usableH]);
      const links=[[0,1],[0,2],[1,2],[1,3],[2,4],[1,5],[2,5],[3,4],[3,5],[4,5],[3,6],[4,7],[5,6],[5,7],[6,7],[6,8],[7,8],[8,9]];
      const sephirotNames=['כֶּתֶר','חָכְמָה','בִּינָה','חֶסֶד','גְּבוּרָה','תִּפְאֶרֶת','נֶצַח','הוֹד','יְסוֹד','מַלְכוּת'];
      const latinNames=['Kether','Chokmah','Binah','Chesed','Geburah','Tiphareth','Netzach','Hod','Yesod','Malkuth'];
 
      // 天使の羽
      const wingCX=W/2,wingCY=H*0.5;
      for(let side=-1;side<=1;side+=2){
        ctx.save();ctx.translate(wingCX,wingCY);ctx.scale(side,1);
        for(let w=0;w<10;w++){
          const wa=0.08+(w/10)*Math.PI*0.8;
          const wlen=W*(0.28+w*0.025);
          const wx=Math.cos(wa)*wlen,wy=-Math.sin(wa)*wlen*0.35;
          ctx.globalAlpha=0.14+0.04*Math.sin(time/800+w);
          ctx.strokeStyle=`hsl(${(hue+w*20)%360},65%,70%)`;
          ctx.lineWidth=2-w*0.12;
          ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(wx*0.5,wy*0.5,wx,wy);ctx.stroke();
          for(let f=1;f<5;f++){
            const ft=f/5,fx=wx*ft,fy=wy*ft,flen=W*0.04*(1-ft*0.4);
            ctx.globalAlpha=0.06;ctx.lineWidth=0.7;
            ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+Math.cos(wa+1.2)*flen,fy+Math.sin(wa+1.2)*flen*0.5);ctx.stroke();
          }
        }
        ctx.restore();
      }
 
      // パスの描画
      links.forEach(([a,b],i)=>{
        const lhue=(hue+i*20)%360;
        ctx.strokeStyle=`hsl(${lhue},75%,65%)`;
        ctx.shadowBlur=18;ctx.shadowColor=`hsl(${lhue},85%,70%)`;
        ctx.globalAlpha=0.6+0.1*Math.sin(time/600+i);
        ctx.lineWidth=2.5;
        ctx.beginPath();ctx.moveTo(nodes[a][0],nodes[a][1]);ctx.lineTo(nodes[b][0],nodes[b][1]);ctx.stroke();
      });
 
      // ノード
      const nodeR=Math.min(W,H)*0.022;
      nodes.forEach(([x,y],i)=>{
        const nhue=(hue+i*36)%360;
        const p2=1+Math.sin(time/500+i*0.7)*0.15;
        const grad=ctx.createRadialGradient(x,y,0,x,y,nodeR*3*p2);
        grad.addColorStop(0,`hsla(${nhue},90%,80%,0.6)`);
        grad.addColorStop(0.5,`hsla(${nhue},80%,60%,0.25)`);
        grad.addColorStop(1,`hsla(${nhue},70%,50%,0)`);
        ctx.globalAlpha=0.9;ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(x,y,nodeR*3*p2,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=0.95;
        ctx.beginPath();ctx.arc(x,y,nodeR*p2,0,Math.PI*2);
        ctx.fillStyle=`hsl(${nhue},80%,78%)`;
        ctx.shadowBlur=18;ctx.shadowColor=`hsl(${nhue},90%,88%)`;
        ctx.fill();
        ctx.strokeStyle=`hsl(${nhue},90%,92%)`;
        ctx.lineWidth=2;ctx.stroke();
 
        const fontSize=Math.max(14,Math.min(W,H)*0.025);
        const textY=y-nodeR*2.4;
        ctx.globalAlpha=0.55;
        ctx.fillStyle='rgba(0,10,40,0.7)';
        ctx.beginPath();
        const tw=fontSize*sephirotNames[i].length*0.65;
        ctx.roundRect(x-tw/2-4,textY-fontSize+2,tw+8,fontSize+4,4);
        ctx.fill();
        ctx.globalAlpha=0.95;
        ctx.fillStyle=`hsl(${nhue},85%,88%)`;
        ctx.font=`bold ${fontSize}px serif`;
        ctx.textAlign='center';
        ctx.shadowBlur=8;ctx.shadowColor='rgba(0,0,0,0.8)';
        ctx.fillText(sephirotNames[i],x,textY);
 
        const fontSizeL=Math.max(10,Math.min(W,H)*0.016);
        const latinY=y+nodeR*2.8;
        ctx.globalAlpha=0.45;
        ctx.fillStyle='rgba(0,10,40,0.65)';
        ctx.beginPath();
        const tw2=fontSizeL*latinNames[i].length*0.62;
        ctx.roundRect(x-tw2/2-3,latinY-fontSizeL+1,tw2+6,fontSizeL+3,3);
        ctx.fill();
        ctx.globalAlpha=0.85;
        ctx.fillStyle='rgba(220,240,255,0.95)';
        ctx.font=`${fontSizeL}px serif`;
        ctx.shadowBlur=4;ctx.shadowColor='rgba(0,0,20,0.9)';
        ctx.fillText(latinNames[i],x,latinY);
      });
 
      // 外周文字
      const outerTexts=['Sephira I','Canalis','Tabula','Moirai','Porta Luci','Sephira II','Mundus','Corona','Dalith','Sephira III'];
      outerTexts.forEach((txt,i)=>{
        const a=Math.PI*2/outerTexts.length*i+t*0.012;
        const r=Math.min(W,H)*0.47;
        const tx=W/2+Math.cos(a)*r,ty=H/2+Math.sin(a)*r;
        ctx.save();ctx.translate(tx,ty);ctx.rotate(a+Math.PI/2);
        const fs=Math.max(11,Math.min(W,H)*0.015);
        ctx.globalAlpha=0.7;
        ctx.fillStyle='rgba(0,10,50,0.6)';
        ctx.font=`${fs}px serif`;ctx.textAlign='center';
        const tw3=fs*txt.length*0.6;
        ctx.beginPath();ctx.roundRect(-tw3/2-3,-fs+1,tw3+6,fs+3,3);ctx.fill();
        ctx.globalAlpha=0.85;
        ctx.fillStyle=`hsl(${(hue+i*36)%360},70%,88%)`;
        ctx.shadowBlur=4;ctx.shadowColor='rgba(0,0,30,0.8)';
        ctx.fillText(txt,0,0);
        ctx.restore();
      });
    }
 
    requestAnimationFrame(draw);
  }
　draw();

// PDFの各ページを画像化する関数
async function extractPdfImages(arrayBuffer){
  if(typeof pdfjsLib==='undefined')throw new Error('PDF.jsが未ロード');
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  const images=[];
  const maxPages=Math.min(pdf.numPages, 10); // 最大10ページまで
  for(let i=1;i<=maxPages;i++){
    const page=await pdf.getPage(i);
    const viewport=page.getViewport({scale: 1.5});
    const canvas=document.createElement('canvas');
    canvas.width=viewport.width; canvas.height=viewport.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    images.push(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
  }
  return images;
}

  const content = b64Array.map(b64=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}}));

function usePersistLocal(key,init){
  const[v,setV]=useState(()=>{try{const s=localStorage.getItem(key);return s!=null?JSON.parse(s):init;}catch{return init;}});
  const set=useCallback(val=>{setV(prev=>{const next=typeof val==='function'?val(prev):val;try{localStorage.setItem(key,JSON.stringify(next));}catch{}return next;});},[key]);
  return[v,set];
}

function calcCost(inp,out){return inp/1e6*3+out/1e6*15;}

// フィードバックをプロンプトに組み込むヘルパー
function buildFeedbackPrompt(feedbacks, project, folder){
  if(!feedbacks||feedbacks.length===0) return '';
  const relevant = feedbacks.filter(fb=>{
    if(fb.scope==='all') return true;
    if(fb.scope==='project' && fb.targets && fb.targets.includes(project)) return true;
    if(fb.scope==='folder' && fb.targets && folder && fb.targets.includes(folder)) return true;
    return false;
  });
  if(relevant.length===0) return '';
  return '\n\n【過去のフィードバックによる改善指示】\n' + relevant.map(fb=>'・'+fb.text).join('\n');
}

async function callClaude(apiKey,messages,system){

function getFileCategory(fileName,mimeType){
  const name=(fileName||'').toLowerCase(),mt=mimeType||'';
  if(/\.(docx|doc)$/.test(name)||mt.includes('wordprocessingml')||mt==='application/msword')return'word';
  if(/\.(pptx|ppt)$/.test(name)||mt.includes('presentationml')||mt==='application/vnd.ms-powerpoint')return'ppt';
  if(/\.(xlsx|xls)$/.test(name)||mt.includes('spreadsheetml')||mt==='application/vnd.ms-excel')return'excel';
  if(/\.pdf$/.test(name)||mt==='application/pdf')return'pdf';
  if(mt.startsWith('image/'))return'image';
  return'text';
}

async function extractPdfText(arrayBuffer){
  if(typeof pdfjsLib==='undefined')throw new Error('PDF.jsが未ロード');
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let text='';
  for(let i=1;i<=Math.min(pdf.numPages,20);i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    text+=content.items.map(item=>item.str).join(' ')+'\n';
  }
  return text.trim();
}
async function extractWordText(arrayBuffer){
  if(typeof mammoth==='undefined')throw new Error('mammoth.jsが未ロード');
  const result=await mammoth.extractRawText({arrayBuffer});return result.value;
}
async function extractZipText(arrayBuffer,fileCategory){
  try{
    const decoder=new TextDecoder('utf-8',{fatal:false});
    const text=decoder.decode(arrayBuffer);
    const matches=text.match(/<(?:t|a:t|si|v)[^>]*>([^<]{1,200})<\/(?:t|a:t|si|v)>/g)||[];
    const extracted=matches.map(m=>m.replace(/<[^>]+>/g,'')).filter(s=>s.trim().length>1).join('\n');
    if(extracted.length>50)return extracted;
    const readable=text.match(/[\u3000-\u9FFF\u30A0-\u30FF\u3040-\u309F\uFF00-\uFFEF\w\s,.!?。、！？「」『』【】（）]{5,}/g)||[];
    return readable.slice(0,200).join('\n').slice(0,5000)||('['+fileCategory+'ファイル: テキスト抽出に一部制限があります]');
  }catch(e){return('['+fileCategory+'ファイル: テキスト抽出に失敗しました]');}
}

function Confetti({active}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!active)return;
    const c=ref.current;if(!c)return;
    const ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight;
    const ps=Array.from({length:80},()=>({x:Math.random()*c.width,y:-20,vx:(Math.random()-.5)*4,vy:Math.random()*4+2,sz:Math.random()*8+4,col:['#F8E070','#FFE890','#FFD700','#FFF8DC','#D0A820'][Math.floor(Math.random()*5)],rot:Math.random()*360,rv:(Math.random()-.5)*8}));
    let raf;
    const draw=()=>{ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.col;ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);ctx.restore();});raf=requestAnimationFrame(draw);};
    draw();return()=>cancelAnimationFrame(raf);
  },[active]);
  if(!active)return null;
  return <canvas ref={ref} style={{position:'fixed',top:0,left:0,pointerEvents:'none',zIndex:9999}}/>;
}

function FileUploadZone({onFile,onDirectFile}){
  const[directMode,setDirectMode]=useState(false);
  const[drag,setDrag]=useState(false);
  const[processingCount,setProcessingCount]=useState(0);
  const[queue,setQueue]=useState([]);
  const ref=useRef(null);
  const processSingle=async(f,callback)=>{
    if(f.size>30*1024*1024){alert(f.name+': ファイルサイズが大きすぎます（最大30MB）');return;}
    const category=getFileCategory(f.name,f.type);
    if(category==='image'){
      await new Promise((res)=>{
        const reader=new FileReader();
        reader.onload=e=>{try{const b64=e.target.result.split(',')[1];if(!b64)throw new Error('画像読み込み失敗');callback({type:'image',base64:b64,mimeType:f.type,name:f.name,category});}catch(err){alert(f.name+': '+err.message);}res();};
        reader.onerror=()=>{alert(f.name+': 読み込み失敗');res();};reader.readAsDataURL(f);
      });return;
    }
    if(['word','pdf','excel','ppt'].includes(category)){
      const arrayBuffer=await f.arrayBuffer();let extractedText='';
      try{if(category==='word')extractedText=await extractWordText(arrayBuffer);else if(category==='pdf')extractedText=await extractPdfText(arrayBuffer);else extractedText=await extractZipText(arrayBuffer,category);}catch(e){extractedText='['+f.name+': テキスト抽出失敗]';}
      callback({type:'text',content:extractedText||('['+f.name+']'),name:f.name,category,mimeType:f.type,fileName:f.name, rawFile:f});return;
    }
    const okExt=/\.(txt|md|csv|json|xml|html|js|ts|py|rb|java|cpp|c|h|css)$/i;
    const okMime=['text/plain','text/csv','text/markdown','application/json','text/html','application/xml'];
    if(!okMime.some(t=>f.type.startsWith(t))&&!okExt.test(f.name)){alert(f.name+': 対応していないファイル形式です');return;}
    await new Promise((res)=>{
      const reader=new FileReader();
      reader.onload=e=>{if(e.target.result)callback({type:'text',content:e.target.result,name:f.name,category:'text'});res();};
      reader.onerror=()=>{alert(f.name+': 読み込み失敗');res();};reader.readAsText(f,'UTF-8');
    });
  };
  const handle=async(files)=>{
    const arr=Array.from(files);if(arr.length===0)return;
    const cb=(directMode&&onDirectFile)?onDirectFile:onFile;
    setProcessingCount(arr.length);
    for(let i=0;i<arr.length;i++){setQueue([arr[i].name]);try{await processSingle(arr[i],cb);}catch(e){alert(arr[i].name+': '+e.message);}}
    setProcessingCount(0);setQueue([]);
  };
  const busy=processingCount>0;
  return(
    <>
    <div style={{display:'flex',justifyContent:'flex-end',marginBottom:4}}>
      <button onClick={()=>setDirectMode(!directMode)} style={{padding:'2px 10px',background:directMode?'rgba(144,192,255,0.18)':'transparent',border:'1px solid rgba(144,192,255,0.35)',borderRadius:10,color:'#90C0FF',fontSize:10,cursor:'pointer'}}>
        {directMode?'📥そのまま登録モード':'🧠解析して登録モード'}
      </button>
    </div>
    <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);handle(e.dataTransfer.files);}}
      onClick={()=>!busy&&ref.current?.click()}
      style={{border:'2px dashed '+(drag?'#F8E070':'rgba(248,224,112,0.32)'),borderRadius:8,padding:'16px 12px',textAlign:'center',cursor:busy?'wait':'pointer',background:drag?'rgba(248,224,112,0.07)':'transparent',transition:'all 0.2s',color:'var(--text2)'}}>
      <input ref={ref} type="file" style={{display:'none'}} multiple
        accept="image/*,.txt,.md,.csv,.json,.xml,.html,.js,.ts,.py,.rb,.java,.cpp,.c,.h,.css,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf"
        onChange={e=>handle(e.target.files)}/>
      <div style={{fontSize:22,marginBottom:4}}>{busy?'⏳':'📎'}</div>
      {busy?(
        <><div style={{fontSize:12,color:'var(--gold)'}}>処理中 {processingCount}件...</div>{queue[0]&&<div style={{fontSize:10,color:'var(--text3)',marginTop:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'100%'}}>{queue[0]}</div>}</>
      ):(
        <><div style={{fontSize:12,color:'var(--text)'}}>{drag?'ドロップ！':'ファイルをドロップ or クリック（複数可）'}</div>
<div style={{fontSize:10,marginTop:5,color:'var(--text3)',lineHeight:'1.7'}}>
  📄 Word　📊 PowerPoint　📈 Excel　📕 PDF<br/>
  🖼️ 画像　📝 テキスト　（最大30MB × 複数）<br/>
  <span style={{color:'var(--red)', fontWeight:'bold'}}>
    ※PowerPointを解析する場合は、PDF化してからアップロードしてください
  </span>
</div></>
      )}
    </div>
  </>
  );
}

// ===== フィードバック適用範囲選択モーダル =====
function FeedbackScopeModal({show,onSave,onCancel,projects,folders}){
  const[scope,setScope]=useState('all');
  const[selectedProjects,setSelectedProjects]=useState([]);
  const[selectedFolders,setSelectedFolders]=useState([]);
  if(!show)return null;
  const allFolderNames=[...new Set(Object.values(folders).flat())];
  const toggleProject=(p)=>setSelectedProjects(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);
  const toggleFolder=(f)=>setSelectedFolders(prev=>prev.includes(f)?prev.filter(x=>x!==f):[...prev,f]);
  const handleSave=()=>{
    if(scope==='project'&&selectedProjects.length===0){alert('プロジェクトを選択してください');return;}
    if(scope==='folder'&&selectedFolders.length===0){alert('フォルダを選択してください');return;}
    onSave({scope,targets:scope==='project'?selectedProjects:scope==='folder'?selectedFolders:[]});
  };
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.88)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:2100}} onClick={onCancel}>
      <div style={{background:'var(--dark2)',border:'1px solid rgba(144,192,255,0.4)',borderRadius:14,padding:'24px 28px',width:400,maxWidth:'90vw',boxShadow:'0 0 40px rgba(144,192,255,0.15)'}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:16,fontWeight:700,color:'#90C0FF',marginBottom:6}}>📐 フィードバックの適用範囲</div>
        <div style={{fontSize:12,color:'var(--text3)',marginBottom:16}}>このフィードバックをどの解析に反映しますか？</div>
        {[{val:'all',label:'🌐 全ての解析に適用'},{val:'project',label:'📁 特定プロジェクトのみ'},{val:'folder',label:'📂 特定フォルダのみ'}].map(opt=>(
          <div key={opt.val} onClick={()=>setScope(opt.val)}
            style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',marginBottom:6,borderRadius:8,border:'1px solid '+(scope===opt.val?'rgba(144,192,255,0.5)':'rgba(144,192,255,0.15)'),background:scope===opt.val?'rgba(144,192,255,0.1)':'transparent',cursor:'pointer',transition:'all 0.15s'}}>
            <div style={{width:14,height:14,borderRadius:'50%',border:'2px solid '+(scope===opt.val?'#90C0FF':'rgba(144,192,255,0.4)'),background:scope===opt.val?'#90C0FF':'transparent',flexShrink:0}}/>
            <span style={{fontSize:13,color:scope===opt.val?'#90C0FF':'var(--text2)'}}>{opt.label}</span>
          </div>
        ))}
        {scope==='project'&&(
          <div style={{marginTop:10,padding:'10px 12px',background:'rgba(144,192,255,0.05)',border:'1px solid rgba(144,192,255,0.2)',borderRadius:8}}>
            <div style={{fontSize:11,color:'#90C0FF',marginBottom:8,fontWeight:600}}>プロジェクトを選択（複数可）</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {projects.map(p=>(
                <div key={p} onClick={()=>toggleProject(p)}
                  style={{padding:'4px 12px',borderRadius:12,border:'1px solid '+(selectedProjects.includes(p)?'rgba(144,192,255,0.7)':'rgba(144,192,255,0.25)'),background:selectedProjects.includes(p)?'rgba(144,192,255,0.2)':'transparent',color:selectedProjects.includes(p)?'#90C0FF':'var(--text3)',fontSize:12,cursor:'pointer',transition:'all 0.15s'}}>
                  {p}</div>
              ))}
            </div>
          </div>
        )}
        {scope==='folder'&&(
          <div style={{marginTop:10,padding:'10px 12px',background:'rgba(144,192,255,0.05)',border:'1px solid rgba(144,192,255,0.2)',borderRadius:8}}>
            <div style={{fontSize:11,color:'#90C0FF',marginBottom:8,fontWeight:600}}>フォルダを選択（複数可）</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {allFolderNames.map(f=>(
                <div key={f} onClick={()=>toggleFolder(f)}
                  style={{padding:'4px 12px',borderRadius:12,border:'1px solid '+(selectedFolders.includes(f)?'rgba(144,192,255,0.7)':'rgba(144,192,255,0.25)'),background:selectedFolders.includes(f)?'rgba(144,192,255,0.2)':'transparent',color:selectedFolders.includes(f)?'#90C0FF':'var(--text3)',fontSize:12,cursor:'pointer',transition:'all 0.15s'}}>
                  {f}</div>
              ))}
            </div>
          </div>
        )}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:18}}>
          <button onClick={onCancel} style={{padding:'7px 16px',background:'transparent',border:'1px solid var(--border)',borderRadius:7,color:'var(--text2)',fontSize:12}}>キャンセル</button>
          <button onClick={handleSave} style={{padding:'7px 16px',background:'rgba(144,192,255,0.18)',border:'1px solid rgba(144,192,255,0.5)',borderRadius:7,color:'#90C0FF',fontSize:12,fontWeight:700}}>適用する</button>
        </div>
      </div>
    </div>
  );
}

// ===== KnowledgeCard（題名インライン編集・フィードバック・関連リンク拡張）=====
function KnowledgeCard({entry,onDelete,onJumpToInput,onUpdateUserMissing,onMoveToProject,allProjects,onAddComment,userName,onUpdateTitle,onSaveFeedback,allFolders,folders}){
  const[open,setOpen]=useState(false);
  const[showOrig,setShowOrig]=useState(false);
  const[userMissing,setUserMissing]=useState(entry.userMissing||[]);
  const[newMissing,setNewMissing]=useState('');
  const[confirmDelete,setConfirmDelete]=useState(false);
  const[commentText,setCommentText]=useState('');
  const[showComments,setShowComments]=useState(false);
  const[editingTitle,setEditingTitle]=useState(false);
  const[editTitle,setEditTitle]=useState(entry.title||'');
  const[feedbackText,setFeedbackText]=useState('');
  const[showFeedbackInput,setShowFeedbackInput]=useState(false);
  const[showScopeModal,setShowScopeModal]=useState(false);
  const[pendingFeedback,setPendingFeedback]=useState(null);
  const comments=entry.comments||[];

  useEffect(()=>{setEditTitle(entry.title||'');},[entry.title]);

  const handleSaveTitle=()=>{
    const t=editTitle.trim();
    if(t&&t!==entry.title)onUpdateTitle&&onUpdateTitle(entry.id,t);
    setEditingTitle(false);
  };

  const addUserMissing=()=>{
    if(!newMissing.trim())return;
    const updated=[...userMissing,{id:'u'+Date.now(),text:newMissing.trim(),byUser:true}];
    setUserMissing(updated);onUpdateUserMissing&&onUpdateUserMissing(entry.id,updated);setNewMissing('');
  };

  const handleAddComment=()=>{
    if(!commentText.trim())return;
    const newComment={id:'c'+Date.now(),text:commentText.trim(),author:userName||'名無し',createdAt:new Date().toISOString()};
    onAddComment&&onAddComment(entry.id,[...comments,newComment]);
    setCommentText('');
  };

  const handleFeedbackSubmit=()=>{
    if(!feedbackText.trim())return;
    setPendingFeedback({text:feedbackText.trim(),entryId:entry.id,entryTitle:entry.title});
    setShowScopeModal(true);

  const handleScopeSelected=(scopeData)=>{
    if(pendingFeedback&&onSaveFeedback){
      onSaveFeedback({...pendingFeedback,...scopeData,createdAt:new Date().toISOString(),id:'fb'+Date.now()});
    }
    setShowScopeModal(false);setPendingFeedback(null);
    setFeedbackText('');setShowFeedbackInput(false);

  const allMissing=[...(entry.missing||[]),...userMissing];
  const catLabel={word:'Word',ppt:'PowerPoint',excel:'Excel',pdf:'PDF',image:'画像',text:'テキスト'};

  // 関連リンク全種まとめ

    ...(entry.subsidies||[]).map(s=>({...s,kind:'subsidy'})),

              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:showFeedbackInput?8:0}}>
                <span style={{fontSize:11,color:'var(--text3)',flex:1}}>この解析の評価</span>
                <button onClick={()=>{onSaveFeedback&&onSaveFeedback({id:'fb'+Date.now(),entryId:entry.id,entryTitle:entry.title,rating:'good',text:'',scope:'all',targets:[],createdAt:new Date().toISOString()});}}
                  title="良い解析でした"
                  style={{padding:'3px 10px',background:'rgba(112,224,160,0.12)',border:'1px solid rgba(112,224,160,0.35)',borderRadius:8,color:'#70E0A0',fontSize:13,cursor:'pointer'}}>👍</button>
                <button onClick={()=>setShowFeedbackInput(!showFeedbackInput)}
                  title="改善点を入力"
                  style={{padding:'3px 10px',background:showFeedbackInput?'rgba(255,144,144,0.2)':'rgba(255,144,144,0.1)',border:'1px solid rgba(255,144,144,0.35)',borderRadius:8,color:'#FF9090',fontSize:13,cursor:'pointer'}}>👎</button>
              </div>
              {showFeedbackInput&&(
                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  <textarea value={feedbackText} onChange={e=>setFeedbackText(e.target.value)}
                    placeholder="改善してほしい点を入力してください（例：要約をより簡潔に、補助金情報をより具体的に）"
                    rows={3}
                    style={{width:'100%',padding:'7px 9px',background:'var(--dark4)',border:'1px solid rgba(255,144,144,0.3)',borderRadius:6,color:'var(--text)',fontSize:12,outline:'none',resize:'none',lineHeight:'1.65'}}/>
                  <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                    <button onClick={()=>{setShowFeedbackInput(false);setFeedbackText('');}}
                      style={{padding:'5px 12px',background:'transparent',border:'1px solid var(--border)',borderRadius:6,color:'var(--text3)',fontSize:11}}>キャンセル</button>
                    <button onClick={handleFeedbackSubmit}
                      style={{padding:'5px 14px',background:'rgba(255,144,144,0.15)',border:'1px solid rgba(255,144,144,0.45)',borderRadius:6,color:'#FF9090',fontSize:11,fontWeight:700}}>送信して適用範囲を選ぶ →</button>
                  </div>
                </div>
              )}
            </div>

            {/* 補足をお願いしたい点 */}
            {allMissing.length>0&&(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,color:'#FF9090',fontWeight:600,marginBottom:5}}>⚠ 補足をお願いしたい点</div>
                <div style={{background:'rgba(255,128,128,0.06)',border:'1px solid rgba(255,128,128,0.22)',borderRadius:6,padding:'8px 10px'}}>
                  {allMissing.map((m,i)=>(
                    <div key={m.id||i} style={{display:'flex',alignItems:'flex-start',gap:6,marginBottom:i<allMissing.length-1?7:0}}>
                      <div style={{flex:1,fontSize:12,color:m.byUser?'#FFC0A0':'#FFB0A0',lineHeight:'1.65',paddingLeft:6,borderLeft:'2px solid '+(m.byUser?'rgba(255,192,160,0.5)':'rgba(255,128,128,0.35)')}}>
                        {m.byUser&&<span style={{fontSize:10,color:'#FFC0A0',marginRight:4,opacity:0.85}}>[自分]</span>}{m.text}</div>
                      <button onClick={()=>onJumpToInput&&onJumpToInput(entry,m)} title="補足を入力する"
                        style={{background:'rgba(248,224,112,0.12)',border:'1px solid rgba(248,224,112,0.28)',borderRadius:4,color:'var(--gold)',fontSize:10,padding:'2px 6px',flexShrink:0,lineHeight:1.5}}>↗</button>
                    </div>
                  ))}
                </div>
                <div style={{display:'flex',gap:5,marginTop:6}}>
                  <input value={newMissing} onChange={e=>setNewMissing(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addUserMissing()} placeholder="補足を追加..."
                    style={{flex:1,padding:'5px 8px',background:'var(--dark4)',border:'1px solid rgba(255,128,128,0.2)',borderRadius:5,color:'var(--text)',fontSize:11,outline:'none'}}/>
                  <button onClick={addUserMissing} style={{padding:'5px 9px',background:'rgba(255,128,128,0.12)',border:'1px solid rgba(255,128,128,0.28)',borderRadius:5,color:'#FF9090',fontSize:11}}>+</button>
                </div>
              </div>
            )}

            {entry.encouragement&&(
              <div style={{marginBottom:10,background:'rgba(112,208,160,0.07)',border:'1px solid rgba(112,208,160,0.2)',borderRadius:6,padding:'7px 10px'}}>
                <span style={{fontSize:11,color:'#70E0A0',fontWeight:600}}>💬 </span>
                <span style={{fontSize:12,color:'#A0E8C0',lineHeight:'1.7'}}>{entry.encouragement}</span>
              </div>
            )}

            {/* 関連リンク */}
            {allLinks.length>0&&(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,color:'#90C0FF',fontWeight:600,marginBottom:5}}>🔗 関連リンク</div>
                <div style={{display:'flex',flexDirection:'column',gap:4}}>
                  {allLinks.map((item,i)=>(
                    <a key={i} href={item.url} target="_blank" rel="noopener noreferrer"
                      style={{display:'flex',alignItems:'center',gap:8,padding:'6px 9px',background:'rgba(80,128,200,0.08)',border:'1px solid rgba(80,128,200,0.22)',borderRadius:6,textDecoration:'none'}}>
                      <span style={{fontSize:9,padding:'1px 5px',borderRadius:8,background:kindBg[item.kind],color:kindColor[item.kind],border:'1px solid '+kindColor[item.kind]+'50',flexShrink:0,whiteSpace:'nowrap'}}>{kindLabel[item.kind]}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,color:'#A0C0F0',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                        <div style={{fontSize:10,color:'#7080B0',marginTop:1}}>{item.reason}</div>
                      </div>
                      <span style={{fontSize:11,color:'#7080B0',flexShrink:0}}>→</span>
                    </a>
                  ))}
                </div>
              </div>
            )}

            {/* コメント欄 */}
            <div style={{background:'rgba(144,192,255,0.04)',border:'1px solid rgba(144,192,255,0.18)',borderRadius:8,padding:'8px 10px'}}>
              <div style={{fontSize:11,color:'#90C0FF',fontWeight:600,marginBottom:6,cursor:'pointer',display:'flex',alignItems:'center',gap:5}}
                onClick={()=>setShowComments(!showComments)}>
                💬 コメント {comments.length>0&&<span style={{background:'rgba(144,192,255,0.2)',borderRadius:8,padding:'0 6px',fontSize:10}}>{comments.length}</span>}
                <span style={{fontSize:10,opacity:0.7,marginLeft:'auto'}}>{showComments?'▲':'▼'}</span>
              </div>
              {showComments&&(
                <>
                  {comments.length>0&&(
                    <div style={{marginBottom:8,display:'flex',flexDirection:'column',gap:5,maxHeight:160,overflowY:'auto'}}>
                      {comments.map(c=>(
                        <div key={c.id} style={{padding:'5px 8px',background:'rgba(20,20,30,0.7)',borderRadius:6,border:'1px solid rgba(144,192,255,0.12)'}}>
                          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                            <span style={{fontSize:10,fontWeight:700,color:'#90C0FF'}}>{c.author||'名無し'}</span>
                            <span style={{fontSize:9,color:'var(--text3)',opacity:0.7}}>{c.createdAt?new Date(c.createdAt).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</span>
                          </div>
                          <div style={{fontSize:12,color:'var(--text2)',lineHeight:'1.6'}}>{c.text}</div>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{display:'flex',gap:5,alignItems:'center'}}>
                    <span style={{fontSize:10,color:'#90C0FF',flexShrink:0,fontWeight:600}}>{userName||'名無し'}</span>
                    <input value={commentText} onChange={e=>setCommentText(e.target.value)}
                      onKeyDown={e=>e.key==='Enter'&&handleAddComment()}
                      placeholder="コメントを入力..."
                      style={{flex:1,padding:'5px 8px',background:'var(--dark4)',border:'1px solid rgba(144,192,255,0.25)',borderRadius:5,color:'var(--text)',fontSize:11,outline:'none'}}/>
                    <button onClick={handleAddComment} style={{padding:'5px 9px',background:'rgba(144,192,255,0.12)',border:'1px solid rgba(144,192,255,0.3)',borderRadius:5,color:'#90C0FF',fontSize:11,flexShrink:0}}>送信</button>
                  </div>
                </>
              )}
            </div>

          </div>
        )}
      </div>
    </>
  );
}


function ProjectTab({project,isActive,isDefault,todoCount,onClick,onRename,onDelete}){

  const[editName,setEditName]=useState(project);
  const[confirmDel,setConfirmDel]=useState(false);
  const submitRename=()=>{const n=editName.trim();if(n&&n!==project)onRename(project,n);setEditing(false);};
  return(
    <>
      <ConfirmDialog show={confirmDel} title="🗑 プロジェクトを削除"
        message={`「${project}」を削除します。\nこのプロジェクトのナレッジとToDoも\nすべて削除されます。`}
        onConfirm={()=>{setConfirmDel(false);onDelete(project);}}
        onCancel={()=>setConfirmDel(false)} confirmLabel="削除する"/>
      {editing?(
        <div style={{display:'flex',gap:3,flexShrink:0,alignItems:'center'}}>
          <input value={editName} onChange={e=>setEditName(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter')submitRename();if(e.key==='Escape'){setEditing(false);setEditName(project);}}}
            style={{padding:'2px 7px',background:'var(--dark3)',border:'1px solid rgba(248,224,112,0.6)',borderRadius:5,color:'var(--gold)',fontSize:11,outline:'none',width:110}}
            autoFocus/>
          <button onClick={submitRename} style={{padding:'2px 7px',background:'rgba(248,224,112,0.2)',border:'1px solid rgba(248,224,112,0.5)',borderRadius:5,color:'var(--gold)',fontSize:11}}>✓</button>
          <button onClick={()=>{setEditing(false);setEditName(project);}} style={{padding:'2px 5px',background:'transparent',border:'1px solid var(--border)',borderRadius:5,color:'var(--text3)',fontSize:11}}>✕</button>
        </div>
      ):(
        <div style={{display:'flex',alignItems:'center',gap:1,flexShrink:0,padding:'4px 10px',borderRadius:16,
          border:'1px solid '+(isActive?'rgba(248,224,112,0.6)':'rgba(248,224,112,0.18)'),
          background:isActive?'rgba(248,224,112,0.15)':'transparent',
          color:isActive?'var(--gold)':'var(--text2)',fontSize:11}}>
          <span onClick={onClick} style={{cursor:'pointer',whiteSpace:'nowrap'}}>📁 {project}</span>
          {todoCount>0&&<span style={{marginLeft:4,fontSize:9,background:'rgba(248,224,112,0.25)',padding:'1px 5px',borderRadius:8,color:'var(--gold)'}}>{todoCount}</span>}
          {isActive&&(
            <span style={{display:'flex',gap:2,marginLeft:5}}>

                style={{background:'none',border:'none',color:'rgba(248,224,112,0.55)',fontSize:10,padding:'0 2px',cursor:'pointer',lineHeight:1}}>✏</button>
              {!isDefault&&(
                <button onClick={e=>{e.stopPropagation();setConfirmDel(true);}} title="削除"
                  style={{background:'none',border:'none',color:'rgba(255,120,120,0.55)',fontSize:10,padding:'0 2px',cursor:'pointer',lineHeight:1}}>✕</button>
              )}
            </span>
          )}
        </div>
      )}
    </>
  );
}

          <span style={{fontSize:15,cursor:'pointer'}} onClick={()=>setOpen(!open)}>{open?'📂':'📁'}</span>
