<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KnowledgeOS - セフィロトの樹</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 既存のスタイルを継承 */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#F8E070;--gold2:#FFE890;--gold3:#D0A820;
  --black:#040404;--dark1:#080808;--dark2:#0E0E0E;--dark3:#1A1A1A;
  --dark4:#222222;--dark5:#2A2A2A;
  --text:#FFFAF0;--text2:#F0E0A0;--text3:#C8A860;
  --red:#FF9090;--green:#70E0A0;--blue:#90C0FF;
  --border:rgba(248,224,112,0.22);
}
:root[data-theme="eva01"] {
  --gold:#A0D860; --gold2:#B8F078; --black:#1A0A2A; --dark1:#24103A; --dark2:#2D1545; --text:#E0FFB0;
}
body{background:var(--black);color:var(--text);font-family:'Noto Serif JP',serif;overflow:hidden;font-size:14px}
/* 知識カードのスタイル */
.knowledge-card{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;position:relative;transition:all 0.3s ease;}
.knowledge-card:hover{border-color:var(--gold);box-shadow:0 0 15px rgba(248,224,112,0.1);}
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>
<div id="app-root"></div>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
let db=null;let auth=null;let storage=null;

// PDF解析ヘルパー
async function extractPdfImages(arrayBuffer){
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  const images=[];
  for(let i=1;i<=Math.min(pdf.numPages,5);i++){
    const page=await pdf.getPage(i);
    const viewport=page.getViewport({scale:1.5});
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d');
    canvas.width=viewport.width; canvas.height=viewport.height;
    await page.render({canvasContext:ctx,viewport}).promise;
    images.push(canvas.toDataURL('image/jpeg',0.8).split(',')[1]);
  }
  return images;
}
  function App() {
  const [entries, setEntries] = usePersistLocal('knowledge_os_entries', []);
  const [currentProject, setCurrentProject] = usePersistLocal('knowledge_os_project', 'メイン');
  const [apiKey, setApiKey] = usePersistLocal('knowledge_os_api_key', '');
  const [userName, setUserName] = usePersistLocal('knowledge_os_user_name', 'User');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [useAiForFile, setUseAiForFile] = useState(false); // AI解析フラグ
  const [showApiModal, setShowApiModal] = useState(false);
  const [jumpInfo, setJumpInfo] = useState(null);

  // --- 修正の核心：handleFile 関数 ---
  const handleFile = async (fileData) => {
    // AI解析がオンで、APIキーがない場合のみ中断
    if (useAiForFile && !apiKey) {
      setShowApiModal(true);
      return;
    }

    setLoading(true);
    setError('');

    try {
      let aiResult = null;
      let fileUrl = null;

      // 1. Storageへのアップロード (CORSエラー等が起きても無視して進む)
      if (fileData.rawFile && typeof storage !== 'undefined') {
        try {
          const fileRef = storage.ref(`uploads/${Date.now()}_${fileData.name}`);
          const snapshot = await fileRef.put(fileData.rawFile);
          fileUrl = await snapshot.ref.getDownloadURL();
          console.log("File uploaded successfully:", fileUrl);
        } catch (e) {
          // ここでエラーが出ても console に出すだけで処理は止めない
          console.warn("Firebase Storage Upload failed (CORS?):", e.message);
        }
      }

      // 2. 【直接登録】AI解析をしない設定の場合
      if (!useAiForFile) {
        const titleToUse = (fileData.name || '無題ファイル').replace(/\.[^/.]+$/, '');
        const entry = {
          id: String(Date.now()),
          createdAt: new Date().toISOString(),
          project: currentProject,
          folder: '未分類',
          title: titleToUse,
          summary: fileData.category === 'image' ? '（画像として登録されました）' : '（ファイルとして登録されました）',
          inputType: 'new',
          improvedPoint: '', missing: [], userMissing: [], comments: [], encouragement: '', aiInsight: '',
          subsidies: [], references: [], papers: [], sites: [],
          content: fileData.category === 'image' ? '' : (fileData.content || ''),
          fileCategory: fileData.category || 'text',
          fileName: fileData.name || '',
          fileUrl: fileUrl, // 成功していればURLが、失敗していればnullが入る
          editorName: userName
        };
        saveEntry(entry); // 共通の保存関数
        setLoading(false);
        return; 
      }

      // 3. 【AI解析】AI解析がオンの場合
      if (fileData.category === 'pdf') {
        const arrBuf = await fileData.rawFile.arrayBuffer();
        const b64Images = await extractPdfImages(arrBuf);
        aiResult = await analyzeMultipleImages(apiKey, b64Images, currentProject, entries, [], '未分類');
      } else if (fileData.category === 'image') {
        aiResult = await analyzeImage(apiKey, fileData.base64, fileData.mimeType, currentProject, entries, [], '未分類');
      } else {
        aiResult = await analyzeText(apiKey, fileData.content, currentProject, entries, [], '未分類');
      }

      // 4. 解析結果を保存
      if (aiResult) {
        const entry = {
          id: String(Date.now()),
          createdAt: new Date().toISOString(),
          project: currentProject,
          folder: '未分類',
          title: aiResult.title || (fileData.name || '').replace(/\.[^/.]+$/, ''),
          summary: aiResult.summary,
          content: fileData.content || '',
          fileCategory: fileData.category || 'text',
          fileName: fileData.name || '',
          fileUrl: fileUrl,
          missing: aiResult.missing || [],
          encouragement: aiResult.encouragement || '',
          aiInsight: aiResult.aiInsight || '',
          editorName: userName
        };
        saveEntry(entry);
      }
    } catch (e) {
      console.error("handleFile Error:", e);
      setError('エラー: ' + e.message);
    } finally {
      setLoading(false);
    }
  };

  const saveEntry = (entry) => {
    setEntries(prev => [entry, ...prev]);
    // Firestore同期などの処理があればここに追加
  };

  // ... (他の状態管理関数など)
  // --- 知識カードコンポーネント ---
function KnowledgeCard({ entry, onDelete, onMoveToProject, allProjects, folders, userName }) {
  const [showOrig, setShowOrig] = useState(false);

  // ファイル形式に応じたアイコンと色の取得
  const cat = entry.fileCategory || 'text';
  const icon = { word:'📄', ppt:'📊', excel:'📈', pdf:'📕', image:'🖼️', text:'📝' }[cat] || '📎';

  return (
    <div className="knowledge-card">
      {/* カードヘッダー */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: 18 }}>{icon}</span>
          <div>
            <div style={{ fontSize: 13, fontWeight: 'bold', color: 'var(--gold)' }}>{entry.title}</div>
            <div style={{ fontSize: 10, color: 'var(--text3)' }}>
              {new Date(entry.createdAt).toLocaleString()} | {entry.editorName || 'Unknown'}
            </div>
          </div>
        </div>
        <button onClick={() => onDelete(entry.id)} style={{ background: 'none', border: 'none', color: 'var(--red)', cursor: 'pointer', fontSize: 12 }}>
          削除
        </button>
      </div>

      {/* 要約エリア */}
      <div style={{ fontSize: 12, lineHeight: 1.6, color: 'var(--text)', marginBottom: 12, whiteSpace: 'pre-wrap' }}>
        {entry.summary}
      </div>

      {/* 表示エリア：画像とボタン */}
      <div style={{ marginTop: 10 }}>
        {/* 画像があれば即座に表示 */}
        {entry.fileUrl && (cat === 'image' || entry.fileName?.match(/\.(jpg|jpeg|png|gif|webp)$/i)) && (
          <div style={{ marginBottom: 12 }}>
            <img 
              src={entry.fileUrl} 
              alt="添付画像" 
              style={{ maxWidth: '100%', maxHeight: '400px', borderRadius: '8px', border: '1px solid var(--border)', display: 'block' }} 
              onError={(e) => {
                e.target.style.display = 'none'; // 読み込み失敗時は隠す
                console.warn("Image load failed - possibly CORS or expired URL");
              }}
            />
          </div>
        )}
        
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
          {/* 金色のボタン：ファイルがあれば表示 */}
          {entry.fileUrl ? (
            <a href={entry.fileUrl} target="_blank" rel="noopener noreferrer"
              style={{ background: 'var(--gold)', color: 'var(--black)', fontSize: 11, fontWeight: 'bold', padding: '5px 12px', borderRadius: 6, textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
              {cat === 'image' ? '🖼️ 画像を開く' : '📂 元ファイルを開く'}
            </a>
          ) : (
            <span style={{ fontSize: 10, color: 'var(--text3)' }}>（ファイル未添付）</span>
          )}

          <button onClick={() => setShowOrig(!showOrig)}
            style={{ background: 'none', border: 'none', color: 'var(--text2)', fontSize: 11, cursor: 'pointer', padding: '5px' }}>
            {showOrig ? '▲ 詳細を閉じる' : '▼ 元データを確認'}
          </button>
        </div>

        {/* 詳細表示エリア（トグル） */}
        {showOrig && (
          <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--border)' }}>
            {/* テキスト内容があれば表示 */}
            {entry.content && (
              <div style={{ fontSize: 11, color: 'var(--text2)', whiteSpace: 'pre-wrap', background: 'rgba(0,0,0,0.2)', padding: 8, borderRadius: 6, marginBottom: 10, maxHeight: 150, overflowY: 'auto' }}>
                {entry.content}
              </div>
            )}
            
            {/* 移動メニュー */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {allProjects.filter(p => p !== entry.project).map(p => (
                <button key={p} onClick={() => onMoveToProject(entry.id, p, '未分類')}
                  style={{ textAlign: 'left', padding: '4px 8px', background: 'rgba(248,224,112,0.05)', border: '1px solid var(--border)', borderRadius: 4, color: 'var(--gold)', fontSize: 10, cursor: 'pointer' }}>
                  🚚 {p} へ移動
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// 最後にアプリをレンダリング
const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
</body>
</html>
