// ===== TodoItem（関連文書表示付き）=====
function TodoItem({todo,onToggle,onDelete,onCelebrate,onUpdateTodo,allEntries}){
  const[done,setDone]=useState(todo.done);
  const[editingText,setEditingText]=useState(false);
  const[editingAssignee,setEditingAssignee]=useState(false);
  const[editText,setEditText]=useState(todo.text);
  const[editAssignee,setEditAssignee]=useState(todo.assignee||'');
  const[confirmDelete,setConfirmDelete]=useState(false);
  useEffect(()=>setDone(todo.done),[todo.done]);
  useEffect(()=>{if(!editingText)setEditText(todo.text);},[todo.text,editingText]);
  useEffect(()=>{if(!editingAssignee)setEditAssignee(todo.assignee||'');},[todo.assignee,editingAssignee]);
  const toggle=()=>{const nd=!done;setDone(nd);onToggle(todo.id,nd);if(nd)onCelebrate?.();};
  const PRIORITIES=['high','medium','low'];
  const nextPriority=(cur)=>PRIORITIES[(PRIORITIES.indexOf(cur)+1)%PRIORITIES.length];
  const pc={high:'#FF9090',medium:'var(--gold)',low:'var(--text3)'};
  const pl={high:'高',medium:'中',low:'低'};
  const handleSaveText=()=>{
    const trimmed=editText.trim();
    if(trimmed&&trimmed!==todo.text)onUpdateTodo&&onUpdateTodo(todo.id,{text:trimmed});
    setEditingText(false);
  };
  const handleSaveAssignee=()=>{
    const trimmed=editAssignee.trim();
    if(trimmed!==todo.assignee)onUpdateTodo&&onUpdateTodo(todo.id,{assignee:trimmed});
    setEditingAssignee(false);
  };

  // 関連文書名を取得
  const relatedEntry=todo.relatedEntryId&&allEntries?allEntries.find(e=>e.id===todo.relatedEntryId):null;

  return(
    <>
      <ConfirmDialog show={confirmDelete} title="🗑 タスクを削除"
        message={`「${todo.text}」\nを削除します。元に戻せません。`}
        onConfirm={()=>{setConfirmDelete(false);onDelete(todo.id);}}
        onCancel={()=>setConfirmDelete(false)} confirmLabel="削除する"/>
      <div style={{display:'flex',alignItems:'flex-start',gap:8,padding:'7px 9px',background:'rgba(28,28,28,0.9)',border:'1px solid '+(done?'rgba(248,224,112,0.08)':'var(--border)'),borderRadius:8,marginBottom:5,opacity:done?0.5:1,transition:'opacity 0.3s'}}>
        <div onClick={toggle} style={{width:18,height:18,minWidth:18,border:'2px solid '+(done?'var(--gold)':'rgba(248,224,112,0.35)'),borderRadius:4,background:done?'rgba(248,224,112,0.18)':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',marginTop:1,transition:'all 0.2s'}}>
          {done&&<span style={{color:'var(--gold)',fontSize:12,lineHeight:1}}>✓</span>}
        </div>
        <div style={{flex:1,minWidth:0}}>
          {editingText?(
            <div style={{display:'flex',gap:4,marginBottom:3}}>
              <input value={editText} onChange={e=>setEditText(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter')handleSaveText();if(e.key==='Escape'){setEditingText(false);setEditText(todo.text);}}}
                style={{flex:1,padding:'3px 7px',background:'var(--dark3)',border:'1px solid rgba(248,224,112,0.5)',borderRadius:5,color:'var(--text)',fontSize:12,outline:'none'}}
                autoFocus/>
              <button onClick={handleSaveText} style={{padding:'2px 8px',background:'rgba(248,224,112,0.2)',border:'1px solid rgba(248,224,112,0.5)',borderRadius:5,color:'var(--gold)',fontSize:11}}>✓</button>
              <button onClick={()=>{setEditingText(false);setEditText(todo.text);}} style={{padding:'2px 6px',background:'transparent',border:'1px solid var(--border)',borderRadius:5,color:'var(--text3)',fontSize:11}}>✕</button>
            </div>
          ):(
            <div style={{display:'flex',alignItems:'center',gap:4}}>
              <div style={{flex:1,fontSize:12,color:'var(--text)',lineHeight:'1.55',textDecoration:done?'line-through':'none'}}>{todo.text}</div>
              {!done&&(
                <button onClick={()=>{setEditText(todo.text);setEditingText(true);}} title="タスクを編集"
                  style={{background:'none',border:'none',color:'rgba(248,224,112,0.4)',fontSize:11,padding:'0 2px',cursor:'pointer',lineHeight:1,flexShrink:0}}>✏</button>
              )}
            </div>
          )}

          {/* 関連文書バッジ */}
          {relatedEntry&&(
            <div style={{fontSize:10,color:'#AB87FF',marginTop:2,display:'inline-flex',alignItems:'center',gap:3,padding:'1px 6px',background:'rgba(171,135,255,0.1)',border:'1px solid rgba(171,135,255,0.25)',borderRadius:8}}>
              📎 {relatedEntry.title}
            </div>
          )}
          {todo.relatedEntryId==='free'&&(
            <div style={{fontSize:10,color:'var(--text3)',marginTop:2,display:'inline-flex',alignItems:'center',gap:3,padding:'1px 6px',background:'rgba(200,168,96,0.08)',border:'1px solid rgba(200,168,96,0.2)',borderRadius:8}}>
              🆓 自由
            </div>
          )}
          {todo.aiGenerated&&(
            <div style={{fontSize:10,color:'var(--text3)',marginTop:1,opacity:0.8}}>🤖 AI提案</div>
          )}

          {/* 担当者 */}
          {editingAssignee?(
            <div style={{display:'flex',gap:4,marginTop:3,alignItems:'center'}}>
              <span style={{fontSize:10,color:'#90C0FF',flexShrink:0}}>👤</span>
              <input value={editAssignee} onChange={e=>setEditAssignee(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter')handleSaveAssignee();if(e.key==='Escape'){setEditingAssignee(false);setEditAssignee(todo.assignee||'');}}}
                placeholder="担当者名"
                style={{flex:1,padding:'2px 7px',background:'var(--dark3)',border:'1px solid rgba(144,192,255,0.4)',borderRadius:5,color:'#90C0FF',fontSize:11,outline:'none'}}
                autoFocus/>
              <button onClick={handleSaveAssignee} style={{padding:'2px 7px',background:'rgba(144,192,255,0.15)',border:'1px solid rgba(144,192,255,0.4)',borderRadius:5,color:'#90C0FF',fontSize:10}}>✓</button>
              <button onClick={()=>{setEditingAssignee(false);setEditAssignee(todo.assignee||'');}} style={{padding:'2px 5px',background:'transparent',border:'1px solid var(--border)',borderRadius:5,color:'var(--text3)',fontSize:10}}>✕</button>
            </div>
          ):(
            <div style={{fontSize:10,color:'#90C0FF',marginTop:2,cursor:done?'default':'pointer',display:'inline-flex',alignItems:'center',gap:3}}
              onClick={()=>{if(!done){setEditAssignee(todo.assignee||'');setEditingAssignee(true);}}}>
              {todo.assignee?(
                <><span>👤 {todo.assignee}</span>{!done&&<span style={{opacity:0.4,fontSize:9}}>（変更）</span>}</>
              ):(
                !done&&<span style={{opacity:0.4,fontStyle:'italic'}}>👤 担当者を設定</span>
              )}
            </div>
          )}
        </div>

        {!done&&(
          <button onClick={()=>onUpdateTodo&&onUpdateTodo(todo.id,{priority:nextPriority(todo.priority||'medium')})}
            title="クリックで優先度変更 高→中→低"
            style={{fontSize:9,color:pc[todo.priority||'medium'],border:'1px solid '+pc[todo.priority||'medium'],borderRadius:8,padding:'2px 7px',flexShrink:0,marginTop:2,background:'rgba(0,0,0,0.3)',cursor:'pointer',fontFamily:'inherit',transition:'all 0.2s'}}>
            {pl[todo.priority||'medium']}
          </button>
        )}
        <button onClick={()=>setConfirmDelete(true)}
          style={{background:'none',border:'none',color:'var(--text3)',fontSize:14,lineHeight:1,padding:'0 2px',opacity:0.6,flexShrink:0}}>×</button>
      </div>
    </>
  );
}

// ===== TodoAddForm（関連文書選択付き）=====
function TodoAddForm({onAdd,allEntries,currentProject}){
  const[todoText,setTodoText]=useState('');
  const[assignee,setAssignee]=useState('');
  const[relatedId,setRelatedId]=useState('free');
  const[searchText,setSearchText]=useState('');
  const[showDropdown,setShowDropdown]=useState(false);
  const dropRef=useRef(null);

  // 現在プロジェクトを優先してソート
  const sortedEntries=useMemo(()=>{
    const current=allEntries.filter(e=>e.project===currentProject);
    const others=allEntries.filter(e=>e.project!==currentProject);
    return[...current,...others];
  },[allEntries,currentProject]);

  const filtered=useMemo(()=>{
    if(!searchText.trim())return sortedEntries;
    return sortedEntries.filter(e=>(e.title||'').includes(searchText)||(e.fileName||'').includes(searchText));
  },[sortedEntries,searchText]);

  const selectedEntry=relatedId&&relatedId!=='free'?allEntries.find(e=>e.id===relatedId):null;

  useEffect(()=>{
    const handleClick=(e)=>{if(dropRef.current&&!dropRef.current.contains(e.target))setShowDropdown(false);};
    document.addEventListener('mousedown',handleClick);
    return()=>document.removeEventListener('mousedown',handleClick);
  },[]);

  const handleAdd=()=>{
    if(!todoText.trim())return;
    onAdd({text:todoText.trim(),assignee:assignee.trim(),relatedEntryId:relatedId||'free'});
    setTodoText('');setAssignee('');setRelatedId('free');setSearchText('');
  };

  return(
    <div style={{display:'flex',flexDirection:'column',gap:5}}>
      <div style={{display:'flex',gap:5}}>
        <input value={todoText} onChange={e=>setTodoText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAdd()}
          placeholder="タスクを追加..."
          style={{flex:1,padding:'7px 9px',background:'var(--dark3)',border:'1px solid var(--border)',borderRadius:6,color:'var(--text)',fontSize:12,outline:'none'}}/>
        <button onClick={handleAdd} style={{padding:'7px 11px',background:'rgba(248,224,112,0.18)',border:'1px solid rgba(248,224,112,0.4)',borderRadius:6,color:'var(--gold)',fontSize:13}}>+</button>
      </div>
      <input value={assignee} onChange={e=>setAssignee(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAdd()}
        placeholder="👤 担当者名（任意）"
        style={{width:'100%',padding:'5px 9px',background:'var(--dark3)',border:'1px solid var(--border)',borderRadius:6,color:'var(--text2)',fontSize:11,outline:'none'}}/>

      {/* 関連文書選択 */}
      <div ref={dropRef} style={{position:'relative'}}>
        <div onClick={()=>setShowDropdown(!showDropdown)}
          style={{padding:'5px 9px',background:'var(--dark3)',border:'1px solid rgba(171,135,255,0.3)',borderRadius:6,cursor:'pointer',display:'flex',alignItems:'center',gap:6,fontSize:11}}>
          <span style={{color:'#AB87FF',flexShrink:0}}>📎</span>
          <span style={{flex:1,color:selectedEntry?'#AB87FF':'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {selectedEntry?selectedEntry.title:relatedId==='free'?'自由（文書に紐付けない）':'文書を選択...'}
          </span>
          <span style={{color:'var(--text3)',fontSize:10}}>{showDropdown?'▲':'▼'}</span>
        </div>
        {showDropdown&&(
          <div style={{position:'absolute',top:'100%',left:0,right:0,zIndex:200,background:'var(--dark2)',border:'1px solid rgba(171,135,255,0.35)',borderRadius:8,marginTop:3,boxShadow:'0 8px 24px rgba(0,0,0,0.5)',maxHeight:220,overflowY:'auto'}}>
            <div style={{padding:'6px 8px',borderBottom:'1px solid var(--border)',position:'sticky',top:0,background:'var(--dark2)'}}>
              <input value={searchText} onChange={e=>setSearchText(e.target.value)}
                placeholder="文書を検索..."
                style={{width:'100%',padding:'4px 8px',background:'var(--dark4)',border:'1px solid rgba(171,135,255,0.25)',borderRadius:5,color:'var(--text)',fontSize:11,outline:'none'}}
                autoFocus/>
            </div>
            {/* 自由オプション */}
            <div onClick={()=>{setRelatedId('free');setShowDropdown(false);}}
              style={{padding:'7px 10px',cursor:'pointer',display:'flex',alignItems:'center',gap:7,background:relatedId==='free'?'rgba(171,135,255,0.1)':'transparent',borderBottom:'1px solid var(--border)'}}>
              <span style={{fontSize:12}}>🆓</span>
              <span style={{fontSize:12,color:relatedId==='free'?'#AB87FF':'var(--text2)'}}>自由（文書に紐付けない）</span>
            </div>
            {/* 区切り：現在プロジェクト */}
            {filtered.some(e=>e.project===currentProject)&&(
              <div style={{padding:'3px 10px',fontSize:10,color:'var(--gold3)',background:'rgba(248,224,112,0.05)',borderBottom:'1px solid var(--border)'}}>
                📁 現在のプロジェクト
              </div>
            )}
            {filtered.filter(e=>e.project===currentProject).map(e=>(
              <div key={e.id} onClick={()=>{setRelatedId(e.id);setShowDropdown(false);}}
                style={{padding:'6px 10px',cursor:'pointer',display:'flex',alignItems:'center',gap:7,background:relatedId===e.id?'rgba(171,135,255,0.1)':'transparent',transition:'background 0.1s'}}
                onMouseEnter={el=>el.currentTarget.style.background='rgba(171,135,255,0.07)'}
                onMouseLeave={el=>el.currentTarget.style.background=relatedId===e.id?'rgba(171,135,255,0.1)':'transparent'}>
                <span style={{fontSize:11}}>{getFileIcon(e.fileCategory||'text')}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,color:relatedId===e.id?'#AB87FF':'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.title}</div>
                  <div style={{fontSize:10,color:'var(--text3)'}}>{e.project}</div>
                </div>
              </div>
            ))}
            {/* 区切り：他プロジェクト */}
            {filtered.some(e=>e.project!==currentProject)&&(
              <div style={{padding:'3px 10px',fontSize:10,color:'var(--text3)',background:'rgba(255,255,255,0.02)',borderTop:'1px solid var(--border)',borderBottom:'1px solid var(--border)'}}>
                📂 他のプロジェクト
              </div>
            )}
            {filtered.filter(e=>e.project!==currentProject).map(e=>(
              <div key={e.id} onClick={()=>{setRelatedId(e.id);setShowDropdown(false);}}
                style={{padding:'6px 10px',cursor:'pointer',display:'flex',alignItems:'center',gap:7,background:relatedId===e.id?'rgba(171,135,255,0.1)':'transparent',transition:'background 0.1s'}}
                onMouseEnter={el=>el.currentTarget.style.background='rgba(171,135,255,0.07)'}
                onMouseLeave={el=>el.currentTarget.style.background=relatedId===e.id?'rgba(171,135,255,0.1)':'transparent'}>
                <span style={{fontSize:11}}>{getFileIcon(e.fileCategory||'text')}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,color:relatedId===e.id?'#AB87FF':'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.title}</div>
                  <div style={{fontSize:10,color:'var(--text3)'}}>{e.project}</div>
                </div>
              </div>
            ))}
            {filtered.length===0&&(
              <div style={{padding:'12px',textAlign:'center',color:'var(--text3)',fontSize:12}}>文書が見つかりません</div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}
function App(){
  const [initState, setInitState] = useState('loading');
  const [loginErr, setLoginErr] = useState('');
  const [currentUser, setCurrentUser] = useState(null);
  const [newVersion, setNewVersion] = useState(null);
  const [entries, setEntries] = useState([]);
  const [projects, setProjects] = useState(['デフォルト']);
  const [todos, setTodos] = useState([]);
  const [folders, setFolders] = useState({'デフォルト':['未分類']});
  const [feedbacks, setFeedbacks] = useState([]);
  const [cursors, setCursors] = useState([]);
  const [currentProject, setCurrentProject] = usePersistLocal('kos_currentProject', 'デフォルト');
  const [apiKey, setApiKey] = usePersistLocal('kos_apikey', '');
  const [totalCost, setTotalCost] = usePersistLocal('kos_cost', 0);
  const [showApiModal, setShowApiModal] = useState(false);
  const [inputText, setInputText] = useState('');
  const [loading, setLoading] = useState(false);
  const cancelRef = useRef(false);
  const [error, setError] = useState('');
  const [celebrate, setCelebrate] = useState(false);
  const [confetti, setConfetti] = useState(false);
  const [newProjectName, setNewProjectName] = useState('');
  const [showAddProject, setShowAddProject] = useState(false);
  const [jumpInfo, setJumpInfo] = useState(null);
  const [showCompleted, setShowCompleted] = useState(false);
  const [newFolderName, setNewFolderName] = useState('');
  const [showAddFolder, setShowAddFolder] = useState(false);
  const textareaRef = useRef(null);
  const cursorUpdateRef = useRef(null);
  
  // ユーザー設定の取得
  const userName = localStorage.getItem('kos_userName') || '名無し';
  const userColor = localStorage.getItem('kos_userColor') || CURSOR_COLORS;

  // UI・背景設定の状態管理
  const [showSettings, setShowSettings] = useState(false); // 全角スペースを除去しました
  const [theme, setTheme] = useState(window.kosTheme || 'default');
  const [bgType, setBgType] = useState(localStorage.getItem('kos_bgType') || 'classic');
  const [editName, setEditName] = useState('');
  const [usageMemo, setUsageMemo] = useState(()=>localStorage.getItem('kos_usage_memo')||'');

  // 背景設定をグローバル変数に同期（描画システム用）
  useEffect(() => {
    window.kosBg = bgType;
  }, [bgType]);

  // Firebase初期化ロジック
  useEffect(() => {
    const stored = localStorage.getItem('kos_firebaseConfig');
    if (!stored) {
      setInitState('need-config');
      return;
    }
    try {
      const config = JSON.parse(stored);
      let app;
      try {
        app = firebase.app();
      } catch {
        app = firebase.initializeApp(config);
      }
      db = app.firestore();
      auth = app.auth();
      const unsubAuth = auth.onAuthStateChanged(user => {
        if (user) {
          setCurrentUser(user);
          setInitState('ready');
        } else {
          setInitState('need-login');
        }
      });
      return () => unsubAuth();
    } catch (e) {
      console.error('Firebase init error:', e);
      localStorage.removeItem('kos_firebaseConfig');
      setInitState('need-config');
    }
  }, []);

  useEffect(()=>{
    if(initState!=='ready'||!db)return;
    const unsubs=[];
    unsubs.push(db.collection('entries').orderBy('createdAt','desc').onSnapshot(snap=>{
      setEntries(snap.docs.map(d=>({...d.data(),id:d.id})));
    },err=>console.warn('entries:',err)));
    unsubs.push(db.collection('todos').onSnapshot(snap=>{
      setTodos(snap.docs.map(d=>({...d.data(),id:d.id})));
    },err=>console.warn('todos:',err)));
    unsubs.push(db.collection('meta').doc('state').onSnapshot(snap=>{
      if(snap.exists){
        const data=snap.data();
        if(data.projects&&Array.isArray(data.projects)){
          setProjects(data.projects);
          setCurrentProject(prev=>{
            if(data.projects.includes(prev))return prev;
            return 'デフォルト';
          });
        }
        if(data.folders&&typeof data.folders==='object')setFolders(data.folders);
      }else{
        db.collection('meta').doc('state').set({projects:['デフォルト'],folders:{'デフォルト':['未分類']}});
      }
    },err=>console.warn('meta:',err)));
    unsubs.push(db.collection('feedbacks').orderBy('createdAt','desc').onSnapshot(snap=>{
      setFeedbacks(snap.docs.map(d=>({...d.data(),id:d.id})));
    },()=>{}));
    unsubs.push(db.collection('cursors').onSnapshot(snap=>{
      setCursors(snap.docs.map(d=>({...d.data(),id:d.id})));
    },()=>{}));
// ★ バージョン監視
   const CURRENT_VERSION = 'v1.1';
unsubs.push(
  db.collection('meta').doc('appVersion')
    .onSnapshot(snap=>{
      if(snap.exists){
        const v=snap.data().version;
        const dismissed=localStorage.getItem('kos_dismissedVersion');
        if(v&&v!==CURRENT_VERSION&&v!==dismissed)setNewVersion(v);
      }
    },()=>{})
);
    return()=>unsubs.forEach(u=>u());
  },[initState]);

  useEffect(()=>{
    if(initState!=='ready'||!currentUser||!db)return;
    const updateCursor=throttle((e)=>{
      db.collection('cursors').doc(currentUser.uid).set({
        x:e.clientX,y:e.clientY,name:userName,color:userColor,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    },150);
    cursorUpdateRef.current=updateCursor;
    document.addEventListener('mousemove',updateCursor);
    return()=>{
      document.removeEventListener('mousemove',updateCursor);
      if(db&&currentUser){db.collection('cursors').doc(currentUser.uid).delete().catch(()=>{});}
    };
  },[initState,currentUser,userName,userColor]);

  const handleLogin=async(name,pw)=>{
    if(!name.trim()){setLoginErr('表示名を入力してください');return;}
    if(pw!=='yoyuudebannzai'){setLoginErr('パスワードが違います');return;}
    try{
      await auth.signInAnonymously();
      const color=CURSOR_COLORS[Math.floor(Math.random()*CURSOR_COLORS.length)];
      localStorage.setItem('kos_userName',name.trim());
      localStorage.setItem('kos_userColor',color);
      setLoginErr('');
      initNotifications();
    }catch(e){setLoginErr('ログインエラー: '+e.message);}
  };

  const handleFirebaseConfig=(config)=>{
    localStorage.setItem('kos_firebaseConfig',JSON.stringify(config));
    window.location.reload();
  };

  const updateMeta=(newProjects,newFolders)=>{
    if(!db)return;
    db.collection('meta').doc('state').set({projects:newProjects||projects,folders:newFolders||folders},{merge:true});
  };

  const saveEntry=(entry)=>{
    if(!db)return;
    const id=String(entry.id);
    const{objectUrl,...rest}=entry;
    db.collection('entries').doc(id).set({...rest,id,objectUrl:null});      sendEmailNotification({title: entry.title || entry.summary || '無題', notification_type: 'ナレッジ追加', project: entry.folder || '未分類', priority: 'medium', due_date: '', notes: ''});
  };

  const deleteEntry=(id)=>{if(!db)return;db.collection('entries').doc(String(id)).delete();todos.filter(t=>t.relatedEntryId===String(id)).forEach(t=>{db.collection('todos').doc(String(t.id)).delete();});};

  const updateUserMissing=(entryId,userMissing)=>{
    if(!db)return;
    db.collection('entries').doc(String(entryId)).update({userMissing});
  };

  const addComment=(entryId,comments)=>{
    if(!db)return;
    db.collection('entries').doc(String(entryId)).update({comments});
  };

  // 題名更新
  const updateEntryTitle=(entryId,newTitle)=>{
    if(!db)return;
    db.collection('entries').doc(String(entryId)).update({title:newTitle});
  };

  // フィードバック保存
  const saveFeedback=(fb)=>{
    if(!db)return;
    db.collection('feedbacks').doc(String(fb.id)).set(fb);
  };

  // ===== EmailJS Gmail通知 =====
  const EMAILJS_SERVICE_ID = 'service_zosf8a2';
  const EMAILJS_TEMPLATE_ID = 'template_bxquwrd';
  const EMAILJS_PUBLIC_KEY = 'x_wFan5XI4QoUTAyu';

  const sendEmailNotification = (todo) => {
    const params = {
      notification_type: 'タスク追加',
      title: todo.title || '(無題)',
      project: todo.project || '未分類',
      priority: todo.priority || 'medium',
      due_date: todo.dueDate || '未設定',
      notes: todo.notes || '',
      created_at: new Date().toLocaleString('ja-JP')
    };
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params, EMAILJS_PUBLIC_KEY)
      .then(() => console.log('EmailJS: 通知送信成功'))
      .catch(err => console.error('EmailJS: 通知送信失敗', err));
  };
  // ===== EmailJS Gmail通知 ここまで =====

  const saveTodo=(todo)=>{
    if(!db)return;
    const id=String(todo.id);
    db.collection('todos').doc(id).set({...todo,id});
          sendEmailNotification(todo);
  };

  const deleteTodo=(id)=>{if(!db)return;db.collection('todos').doc(String(id)).delete();};

  const toggleTodo=(id,done)=>{if(!db)return;db.collection('todos').doc(String(id)).update({done});};

  const updateTodo=(id,fields)=>{
    if(!db)return;
    db.collection('todos').doc(String(id)).update(fields);
  };

  const projectEntries=entries.filter(e=>e.project===currentProject);
  const projectTodos=todos.filter(t=>t.project===currentProject);
  const pendingTodos=projectTodos.filter(t=>!t.done);
  const doneTodos=projectTodos.filter(t=>t.done);
  const currentFolders=(folders[currentProject])||['未分類'];

  const folderMap={};
  currentFolders.forEach(f=>{folderMap[f]=[];});
  projectEntries.forEach(e=>{
    const f=e.folder&&currentFolders.includes(e.folder)?e.folder:'未分類';
    if(!folderMap[f])folderMap[f]=[];
    folderMap[f].push(e);
  });

  const addFolder=()=>{
    const n=newFolderName.trim();if(!n)return;
    const cur=folders[currentProject]||['未分類'];
    if(cur.includes(n))return;
    const newF={...folders,[currentProject]:[...cur,n]};
    updateMeta(projects,newF);
    setNewFolderName('');setShowAddFolder(false);
  };

  const deleteFolder=(folderName)=>{
    if(folderName==='未分類'||!db)return;
    projectEntries.filter(e=>e.folder===folderName).forEach(e=>{
      db.collection('entries').doc(String(e.id)).update({folder:'未分類'});
    });
    const cur=folders[currentProject]||['未分類'];
    const newF={...folders,[currentProject]:cur.filter(f=>f!==folderName)};
    updateMeta(projects,newF);
  };

  const moveEntry=(entryId,targetFolder)=>{
    if(!db)return;
    db.collection('entries').doc(String(entryId)).update({folder:targetFolder});
  };

  // ★ アイテム移動時にタスクも一緒に移動
  const moveEntryToProject=(entryId, targetProject, targetFolder)=>{
    if(!db)return;
    db.collection('entries').doc(String(entryId)).update({
      project:targetProject,
      folder:targetFolder||'未分類'
    });
    // 関連タスクも移動
    todos.filter(t=>t.relatedEntryId===entryId).forEach(t=>{
      db.collection('todos').doc(String(t.id)).update({project:targetProject});
    });
  };

  const handleSubmit=async()=>{
    if(!inputText.trim()){setError('テキストを入力してください');return;}
    if(!apiKey){setShowApiModal(true);return;}
    cancelRef.current=false;setLoading(true);setError('');
    try{
      const ai=await analyzeText(apiKey,inputText,currentProject,projectEntries,feedbacks,'未分類');
      if(cancelRef.current){setLoading(false);return;}
      const cost=calcCost(ai.inp||0,ai.out||0);
      setTotalCost(prev=>+(prev+cost).toFixed(6));
      const id=String(Date.now());
      const entry={
        id,createdAt:new Date().toISOString(),project:currentProject,folder:'未分類',
        title:ai.title,summary:ai.summary,inputType:ai.inputType||'new',
        improvedPoint:ai.improvedPoint||'',
        missing:(ai.missing||[]).map(m=>typeof m==='string'?{id:'m'+Math.random(),text:m}:m),
        userMissing:[],comments:[],
        encouragement:ai.encouragement||'',
        aiInsight:ai.aiInsight||'',
        subsidies:ai.subsidies||[],
        references:ai.references||[],
        papers:ai.papers||[],
        sites:ai.sites||[],
        content:inputText,relatedEntryId:jumpInfo?.entryId||null,
        fileCategory:'text',fileName:'',objectUrl:null,editorName:userName
      };
      saveEntry(entry);
      // AIが生成するタスクにrelatedEntryIdをセット
      if(ai.todos&&ai.todos.length>0){
        const downgrade={high:'medium',medium:'low',low:'low'};
        todos.filter(t=>t.project===currentProject&&t.aiGenerated&&!t.done).forEach(t=>{
          db.collection('todos').doc(String(t.id)).update({priority:downgrade[t.priority]||t.priority});
        });
        ai.todos.forEach((t,i)=>{
          const tid=String(Date.now()+i+1);
          saveTodo({
            id:tid,text:t.text,priority:t.priority||'medium',
            project:currentProject,done:false,aiGenerated:true,
            assignee:'',relatedEntryId:id  // ★ 生成元の文書IDをセット
          });
        });
      }
      setInputText('');setJumpInfo(null);
    }catch(e){setError('エラー: '+e.message);}
    finally{setLoading(false);}
  };
  const handleDirectSave=()=>{
    if(!inputText.trim()){setError('テキストを入力してください');return;}
    const id=String(Date.now());
    const title=(inputText.trim().split('\n')[0]||'ノータイトル').substring(0,20);
    const entry={id,createdAt:new Date().toISOString(),project:currentProject,folder:'未分類',
      title,summary:inputText.trim().substring(0,300),inputType:'new',improvedPoint:'',
      missing:[],userMissing:[],comments:[],encouragement:'',aiInsight:'',
      subsidies:[],references:[],papers:[],sites:[],
      content:inputText,relatedEntryId:jumpInfo?.entryId||null,
      fileCategory:'text',fileName:'',objectUrl:null,editorName:userName};
    saveEntry(entry);setInputText('');setJumpInfo(null);
  };
  const handleDirectFile=async(fileData)=>{
    setLoading(true);setError('');
    try{
      const id=String(Date.now());
      const isImage=fileData.category==='image';
      const titleToUse=(fileData.name||'ノータイトル').replace(/\.[^/.]+$/,'');
      const entry={id,createdAt:new Date().toISOString(),project:currentProject,folder:'未分類',
        title:titleToUse,summary:isImage?('[画像: '+fileData.name+']'):((fileData.content||'').substring(0,300)),
        inputType:'new',improvedPoint:'',missing:[],userMissing:[],comments:[],
        encouragement:'',aiInsight:'',subsidies:[],references:[],papers:[],sites:[],
        content:isImage?('[image:'+fileData.name+']'):(fileData.content||''),
        relatedEntryId:jumpInfo?.entryId||null,
        fileCategory:fileData.category||'text',fileName:fileData.name||'',
        imageBase64:isImage?fileData.base64:null,imageMimeType:isImage?fileData.mimeType:null,
        objectUrl:null,editorName:userName};
      saveEntry(entry);setJumpInfo(null);
    }catch(e){setError('エラー: '+e.message);}
    finally{setLoading(false);}
  };

  const handleFile=async(fileData)=>{
    if(!apiKey){setShowApiModal(true);return;}
    cancelRef.current=false;setLoading(true);setError('');
    try{
      let ai;
      let fileUrl = null;
      
      // Storageにアップロード
      if(fileData.rawFile && storage) {
        try {
          const fileRef = storage.ref(`uploads/${Date.now()}_${fileData.name}`);
          await fileRef.put(fileData.rawFile);
          fileUrl = await fileRef.getDownloadURL();
        } catch(e) { console.warn("Storage upload failed", e); }
      }

      if(fileData.category === 'pdf'){
        // PDFの場合は各ページを画像化して解析
        const arrBuf = await fileData.rawFile.arrayBuffer();
        const b64Images = await extractPdfImages(arrBuf);
        ai = await analyzeMultipleImages(apiKey, b64Images, currentProject, projectEntries, feedbacks, '未分類');
      } else if(fileData.type==='image'){
        ai=await analyzeImage(apiKey,fileData.base64,fileData.mimeType,currentProject,projectEntries,feedbacks,'未分類');
      }else{
        ai=await analyzeText(apiKey,fileData.content,currentProject,projectEntries,feedbacks,'未分類');
      }
      const cost=calcCost(ai.inp||0,ai.out||0);
      setTotalCost(prev=>+(prev+cost).toFixed(6));
      const id=String(Date.now());
      // ★ ファイルの場合はファイル名をtitleにセット
      const titleToUse=(fileData.name||ai.title).replace(/\.[^/.]+$/,'');
      const entry={
        id,createdAt:new Date().toISOString(),project:currentProject,folder:'未分類',
        title:titleToUse,
        summary:ai.summary,inputType:ai.inputType||'new',
        improvedPoint:ai.improvedPoint||'',
        missing:(ai.missing||[]).map(m=>typeof m==='string'?{id:'m'+Math.random(),text:m}:m),
        userMissing:[],comments:[],
        encouragement:ai.encouragement||'',
        aiInsight:ai.aiInsight||'',
        subsidies:ai.subsidies||[],
        references:ai.references||[],
        papers:ai.papers||[],
        sites:ai.sites||[],
        content:fileData.content||('[画像: '+fileData.name+']'),
        relatedEntryId:jumpInfo?.entryId||null,
        fileCategory:fileData.category||'text',
        fileName:fileData.name||'',objectUrl:null,editorName:userName
      };
      saveEntry(entry);
      // AIが生成するタスクにrelatedEntryIdをセット
      if(ai.todos&&ai.todos.length>0){
        const downgrade={high:'medium',medium:'low',low:'low'};
        todos.filter(t=>t.project===currentProject&&t.aiGenerated&&!t.done).forEach(t=>{
          db.collection('todos').doc(String(t.id)).update({priority:downgrade[t.priority]||t.priority});
        });
        ai.todos.forEach((t,i)=>{
          const tid=String(Date.now()+i+1);
          saveTodo({
            id:tid,text:t.text,priority:t.priority||'medium',
            project:currentProject,done:false,aiGenerated:true,
            assignee:'',relatedEntryId:id  // ★ 生成元の文書IDをセット
          });
        });
      }
      setJumpInfo(null);
    }catch(e){setError('エラー: '+e.message);}
    finally{setLoading(false);}
  };

  const handleJumpToInput=(entry,missing)=>{
    setJumpInfo({entryId:entry.id,missingId:missing.id,missingText:missing.text});
    setInputText('【補足: '+missing.text+'】\n\n');
    textareaRef.current?.focus();
  };

  // ★ TodoAddFormからの追加（関連文書ID付き）
  const addTodo=({text,assignee,relatedEntryId})=>{
    if(!text.trim())return;
    const id=String(Date.now());
    saveTodo({
      id,text:text.trim(),priority:'medium',project:currentProject,
      done:false,aiGenerated:false,
      assignee:assignee||'',
      relatedEntryId:relatedEntryId||'free'
    });
  };

  const triggerCelebrate=()=>{
    setConfetti(true);setCelebrate(true);
    setTimeout(()=>{setConfetti(false);setCelebrate(false);},3200);
  };

  const addProject=()=>{
    const n=newProjectName.trim();
    if(!n||projects.includes(n))return;
    const newP=[...projects,n];
    const newF={...folders,[n]:['未分類']};
    updateMeta(newP,newF);
    setCurrentProject(n);setNewProjectName('');setShowAddProject(false);
  };

  const renameProject=(oldName,newName)=>{
    if(!newName.trim()||projects.includes(newName))return;
    const newP=projects.map(p=>p===oldName?newName:p);
    const newF={...folders};
    if(newF[oldName]){newF[newName]=newF[oldName];delete newF[oldName];}
    updateMeta(newP,newF);
    entries.filter(e=>e.project===oldName).forEach(e=>{db.collection('entries').doc(String(e.id)).update({project:newName});});
    todos.filter(t=>t.project===oldName).forEach(t=>{db.collection('todos').doc(String(t.id)).update({project:newName});});
    if(currentProject===oldName)setCurrentProject(newName);
  };

  const deleteProject=(name)=>{
    if(name==='デフォルト')return;
    const newP=projects.filter(p=>p!==name);
    const newF={...folders};delete newF[name];
    updateMeta(newP,newF);
    entries.filter(e=>e.project===name).forEach(e=>{db.collection('entries').doc(String(e.id)).delete();});
    todos.filter(t=>t.project===name).forEach(t=>{db.collection('todos').doc(String(t.id)).delete();});
    if(currentProject===name)setCurrentProject('デフォルト');
  };

  const saveKey=k=>{setApiKey(k);setShowApiModal(false);};
if(initState==='loading'){
    return(
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',gap:14,color:'var(--gold)'}}>
        <div style={{fontSize:36}}>⚡</div>
        <div style={{fontSize:14,letterSpacing:'0.15em'}}>Firebase に接続中...</div>
      </div>
    );
  }

  return(
    <React.Fragment>
      <FirebaseConfigModal show={initState==='need-config'} onSave={handleFirebaseConfig}/>
      <LoginModal show={initState==='need-login'} onLogin={handleLogin} loginErr={loginErr}/>
      {initState==='ready'&&(
        <>
          <Confetti active={confetti}/>
          <CelebrationOverlay show={celebrate} onDone={()=>{setCelebrate(false);setConfetti(false);}}/>
          <ApiKeyModal show={showApiModal} onSave={saveKey} onClose={()=>setShowApiModal(false)}/>
          <CursorOverlay cursors={cursors} currentUid={currentUser?.uid}/>

          {showSettings&&(
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:3000}}>
              <div style={{background:'var(--dark2)',border:'1px solid var(--border)',borderRadius:12,padding:30,width:400,maxWidth:'90vw'}}>
                <div style={{fontSize:18,fontWeight:700,color:'var(--gold)',marginBottom:16}}>⚙️ 設定</div>
                <div style={{marginBottom:10,color:'var(--text2)',fontSize:13}}>UIテーマ</div>
                <select
                  value={theme}
                  onChange={e=>{
                    setTheme(e.target.value);
                    window.kosTheme=e.target.value;
                    localStorage.setItem('kos_theme',e.target.value);
                    document.documentElement.setAttribute('data-theme',e.target.value);
                  }}
                  style={{width:'100%',padding:10,background:'var(--dark4)',border:'1px solid var(--border)',borderRadius:6,color:'var(--text)',fontSize:13,marginBottom:20}}
                >
                  <option value="default">デフォルト（黒×金）</option>
                  <option value="eva01">エヴァ初号機（紫×黄緑）</option>
                  <option value="eva02">エヴァ2号機（赤×オレンジ）</option>
                  <option value="mark6">Mark.6（暗青×オレンジ）</option>
                </select>
                <div style={{marginBottom:10,color:'var(--text2)',fontSize:13,marginTop:16}}>動的背景エフェクト</div>
                <select
                  value={bgType}
                  onChange={e=>{
                    setBgType(e.target.value);
                    window.kosBg=e.target.value;
                    localStorage.setItem('kos_bgType',e.target.value);
                  }}
                  style={{width:'100%',padding:10,background:'var(--dark4)',border:'1px solid var(--border)',borderRadius:6,color:'var(--text)',fontSize:13,marginBottom:20}}
                >
                  <option value="classic">幾何学エヴァ★デフォルト</option>
<option value="lance">ロンギヌスの槍（脈動アニメ）</option>
<option value="sephiroth">セフィロトの樹（虹色発光）</option>
                </select>
                <div style={{marginBottom:10,color:'var(--text2)',fontSize:13,marginTop:16}}>表示名の変更</div>
                <div style={{display:'flex',gap:8,marginBottom:20}}>
                  <input
                    value={editName}
                    onChange={e=>setEditName(e.target.value)}
                    placeholder="新しい表示名"
                    style={{flex:1,padding:'8px 10px',background:'var(--dark4)',border:'1px solid var(--border)',borderRadius:6,color:'var(--text)',fontSize:13,outline:'none'}}
                  />
                  <button
                    onClick={()=>{
                      if(editName.trim()){
                        localStorage.setItem('kos_userName',editName.trim());
                        setEditName('');
                        alert('表示名を「'+editName.trim()+'」に変更しました。\n反映にはページ再読み込みが必要です。');
                      }
                    }}
                    style={{padding:'8px 16px',background:'rgba(248,224,112,0.18)',border:'1px solid rgba(248,224,112,0.6)',borderRadius:6,color:'var(--gold)',fontSize:13,fontWeight:600}}
                  >
                    変更
                  </button>
                </div>
                <div style={{marginBottom:10,color:'var(--text2)',fontSize:13,marginTop:16}}>📖 使い方メモ</div>
                <textarea
                  value={usageMemo}
                  onChange={e=>{
                    setUsageMemo(e.target.value);
                    localStorage.setItem('kos_usage_memo',e.target.value);
                  }}
                  placeholder="チームへの使い方・ルール・注意事項などを自由に書いてください..."
                  rows={6}
                  style={{width:'100%',padding:'10px',background:'var(--dark4)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',fontSize:12,outline:'none',resize:'vertical',lineHeight:'1.7',marginBottom:4}}
                />
                <div style={{fontSize:10,color:'var(--text3)',marginBottom:16}}>※ このブラウザのみに保存されます</div>
                <div style={{textAlign:'right'}}>
                  <button
                    onClick={()=>setShowSettings(false)}
                    style={{padding:'7px 16px',background:'rgba(248,224,112,0.18)',border:'1px solid rgba(248,224,112,0.6)',borderRadius:6,color:'var(--gold)'}}
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* バージョン通知バナー */}
          {newVersion&&(
            <div style={{background:'#ff9800',color:'#fff',padding:'8px 16px',textAlign:'center',fontSize:14,position:'sticky',top:0,zIndex:9999,flexShrink:0}}>
              🔔 新しいバージョン ({newVersion}) が公開されました。
              <button onClick={()=>{
                localStorage.setItem('kos_dismissedVersion',newVersion);
                window.location.reload();
              }} style={{marginLeft:12,background:'#fff',color:'#ff9800',border:'none',borderRadius:4,padding:'2px 10px',cursor:'pointer',fontFamily:'inherit'}}>
                今すぐ更新
              </button>
              <button onClick={()=>{
                localStorage.setItem('kos_dismissedVersion',newVersion);
                setNewVersion(null);
              }} style={{marginLeft:8,background:'transparent',color:'#fff',border:'1px solid #fff',borderRadius:4,padding:'2px 8px',cursor:'pointer',fontFamily:'inherit'}}>
                後で
              </button>
            </div>
          )}

          {/* ヘッダー */}
          <header style={{padding:'0 16px',height:52,display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid var(--border)',background:'rgba(8,8,8,0.92)',flexShrink:0}}>
            <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
              <div>
                <div style={{fontSize:16,fontWeight:700,color:'var(--gold)',letterSpacing:'0.12em'}}>KnowledgeOS</div>
                <div style={{fontSize:9,color:'var(--text3)',letterSpacing:'0.18em'}}>知識統合システム v3 — Firebase共同編集</div>
              </div>
            </div>
            <QuoteZone userName={userName}/>
            <div style={{display:'flex',gap:6,alignItems:'center',flexShrink:0}}>
              <PresenceBar cursors={cursors} currentUid={currentUser?.uid}/>
              <div style={{display:'flex',alignItems:'center',gap:5,padding:'3px 10px',background:'rgba(248,224,112,0.08)',border:'1px solid rgba(248,224,112,0.2)',borderRadius:12}}>
                <div style={{width:10,height:10,borderRadius:'50%',background:userColor,flexShrink:0}}/>
                <span style={{fontSize:11,color:'var(--text2)'}}>{userName}</span>
              </div>
              <button onClick={()=>setShowApiModal(true)}
                style={{padding:'5px 12px',background:apiKey?'rgba(112,224,160,0.1)':'rgba(255,144,144,0.1)',border:'1px solid '+(apiKey?'rgba(112,224,160,0.35)':'rgba(255,144,144,0.35)'),borderRadius:6,color:apiKey?'#70E0A0':'#FF9090',fontSize:11}}>
                🔑 {apiKey?'API設定済':'APIキー設定'}
              </button>
              <button onClick={()=>setShowSettings(true)}
                style={{padding:'5px 12px',background:'transparent',border:'1px solid var(--border)',borderRadius:6,color:'var(--gold)',fontSize:11}}>
                ⚙️ 設定
              </button>
            </div>
          </header>

          {/* プロジェクトタブ */}
          <div style={{display:'flex',alignItems:'center',gap:4,padding:'6px 16px',borderBottom:'1px solid var(--border)',background:'rgba(8,8,8,0.88)',flexShrink:0,overflowX:'auto'}}>
            {projects.map(p=>(
              <ProjectTab key={p} project={p} isActive={currentProject===p} isDefault={p==='デフォルト'}
                todoCount={todos.filter(t=>t.project===p&&!t.done).length}
                onClick={()=>setCurrentProject(p)} onRename={renameProject} onDelete={deleteProject}/>
            ))}
            {showAddProject?(
              <div style={{display:'flex',gap:4,flexShrink:0}}>
                <input value={newProjectName} onChange={e=>setNewProjectName(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter')addProject();if(e.key==='Escape')setShowAddProject(false);}}
                  placeholder="プロジェクト名"
                  style={{padding:'3px 8px',background:'var(--dark3)',border:'1px solid var(--border)',borderRadius:5,color:'var(--text)',fontSize:11,outline:'none',width:110}}
                  autoFocus/>
                <button onClick={addProject} style={{padding:'3px 8px',background:'rgba(248,224,112,0.15)',border:'1px solid rgba(248,224,112,0.4)',borderRadius:5,color:'var(--gold)',fontSize:11}}>追加</button>
                <button onClick={()=>setShowAddProject(false)} style={{padding:'3px 6px',background:'transparent',border:'1px solid var(--border)',borderRadius:5,color:'var(--text3)',fontSize:11}}>✕</button>
              </div>
            ):(
              <button onClick={()=>setShowAddProject(true)} style={{padding:'4px 10px',borderRadius:16,border:'1px dashed rgba(248,224,112,0.25)',background:'transparent',color:'var(--text2)',fontSize:11,flexShrink:0}}>＋ 新規</button>
            )}
          </div>

          {/* メインコンテンツ */}
          <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 1.2fr 0.9fr',overflow:'hidden'}}>

            {/* 左カラム：Knowledge Input */}
            <div style={{borderRight:'1px solid var(--border)',overflowY:'auto',padding:14,display:'flex',flexDirection:'column',gap:10}}>
              <div style={{fontSize:10,color:'var(--text3)',letterSpacing:'0.18em',textTransform:'uppercase'}}>Knowledge Input</div>
              {jumpInfo&&(
                <div style={{padding:'7px 10px',background:'rgba(248,224,112,0.07)',border:'1px solid rgba(248,224,112,0.28)',borderRadius:6,fontSize:11,color:'var(--gold)'}}>
                  ✏️ 補足モード：<span style={{color:'var(--text2)'}}>{jumpInfo.missingText}</span>
                  <button onClick={()=>{setJumpInfo(null);setInputText('');}} style={{marginLeft:8,background:'none',border:'none',color:'var(--text3)',fontSize:11,cursor:'pointer'}}>✕</button>
                </div>
              )}
              <div>
                <label style={{fontSize:11,color:'var(--text3)',display:'block',marginBottom:5}}>テキスト入力</label>
                <textarea ref={textareaRef} value={inputText} onChange={e=>setInputText(e.target.value)} rows={7}
                  placeholder="知識・メモ・情報を入力..."
                  style={{width:'100%',padding:'8px 10px',background:'var(--dark3)',border:'1px solid var(--border)',borderRadius:7,color:'var(--text)',fontSize:12,lineHeight:'1.75',resize:'vertical',outline:'none'}}/>
              </div>
              <div style={{display:'flex',gap:6}}>
                {loading?(
                <button onClick={()=>{cancelRef.current=true;setLoading(false);setError('⛔ キャンセルしました');}}
                  style={{flex:1,padding:'9px',background:'rgba(255,100,100,0.18)',border:'1px solid rgba(255,100,100,0.55)',borderRadius:8,color:'#FF6464',fontSize:13,fontWeight:600,cursor:'pointer',transition:'all 0.2s'}}>
                  ⛔ キャンセル
                </button>
              ):(
                <button onClick={handleSubmit}
                  style={{flex:1,padding:'9px',background:'rgba(248,224,112,0.18)',border:'1px solid rgba(248,224,112,0.55)',borderRadius:8,color:'var(--gold)',fontSize:13,fontWeight:600,transition:'all 0.2s'}}>
                  ✨ 解析して登録
                </button>
              )}
                <button onClick={handleDirectSave} disabled={loading}
                  style={{flex:1,padding:'9px',background:loading?'rgba(144,192,255,0.04)':'rgba(144,192,255,0.12)',border:'1px solid rgba(144,192,255,0.4)',borderRadius:8,color:loading?'var(--text3)':'#90C0FF',fontSize:13,fontWeight:600,transition:'all 0.2s'}}>
                  📥 そのまま登録
                </button>
              </div>
              <div>
                <label style={{fontSize:11,color:'var(--text3)',display:'block',marginBottom:5}}>ファイル入力（複数可）</label>
                <FileUploadZone onFile={handleFile} onDirectFile={handleDirectFile}/>
              </div>
              {error&&(
                <div style={{padding:'8px 10px',background:'rgba(255,144,144,0.08)',border:'1px solid rgba(255,144,144,0.28)',borderRadius:6,color:'#FFAAAA',fontSize:12}}>⚠ {error}</div>
              )}
              <div style={{marginTop:'auto',padding:'7px 10px',background:'rgba(248,224,112,0.05)',border:'1px solid rgba(248,224,112,0.15)',borderRadius:6}}>
                <div style={{fontSize:10,color:'var(--text3)',marginBottom:2}}>💰 累計API使用料金（自分のみ）</div>
                <div style={{fontSize:14,color:'var(--gold)',fontWeight:600}}>${totalCost.toFixed(4)}</div>
                <div style={{fontSize:9,color:'var(--text3)',marginTop:1}}>Sonnet 4 概算（$3/$15 per MTok）</div>
              </div>
            </div>

            {/* 中カラム：Knowledge Base */}
            <div style={{borderRight:'1px solid var(--border)',overflowY:'auto',padding:14}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12,flexWrap:'wrap',gap:6}}>
                <div style={{fontSize:10,color:'var(--text3)',letterSpacing:'0.18em',textTransform:'uppercase'}}>
                  Knowledge Base — {projectEntries.length}件 / {currentProject}
                </div>
                {showAddFolder?(
                  <div style={{display:'flex',gap:4}}>
                    <input value={newFolderName} onChange={e=>setNewFolderName(e.target.value)}
                      onKeyDown={e=>{if(e.key==='Enter')addFolder();if(e.key==='Escape')setShowAddFolder(false);}}
                      placeholder="フォルダ名"
                      style={{padding:'2px 7px',background:'var(--dark3)',border:'1px solid var(--border)',borderRadius:5,color:'var(--text)',fontSize:11,outline:'none',width:90}}
                      autoFocus/>
                    <button onClick={addFolder} style={{padding:'2px 7px',background:'rgba(248,224,112,0.15)',border:'1px solid rgba(248,224,112,0.4)',borderRadius:5,color:'var(--gold)',fontSize:11}}>追加</button>
                    <button onClick={()=>setShowAddFolder(false)} style={{padding:'2px 5px',background:'transparent',border:'1px solid var(--border)',borderRadius:5,color:'var(--text3)',fontSize:11}}>✕</button>
                  </div>
                ):(
                  <button onClick={()=>setShowAddFolder(true)} style={{padding:'3px 9px',borderRadius:12,border:'1px dashed rgba(248,224,112,0.3)',background:'transparent',color:'var(--text3)',fontSize:10}}>
                    📁＋ フォルダ追加
                  </button>
                )}
              </div>
              {projectEntries.length===0?(
                <div style={{textAlign:'center',padding:'40px 20px',color:'var(--text3)',fontSize:12}}>
                  <div style={{fontSize:30,marginBottom:10}}>📚</div>
                  <div>ナレッジはまだありません</div>
                  <div style={{fontSize:11,marginTop:5}}>左のフォームから入力してください</div>
                </div>
              ):(
                currentFolders.map(folderName=>{
                  const fEntries=folderMap[folderName]||[];
                  if(fEntries.length===0&&currentFolders.length===1)return null;
                  return(
                    <KnowledgeFolder key={folderName} folderName={folderName} entries={fEntries}
                      onDelete={deleteEntry} onJumpToInput={handleJumpToInput}
                      onUpdateUserMissing={updateUserMissing} onMoveToProject={moveEntryToProject}
                      allProjects={projects} onAddComment={addComment} userName={userName}
                      onDeleteFolder={deleteFolder} onUpdateTitle={updateEntryTitle}
                      onSaveFeedback={saveFeedback} folders={folders}/>
                  );
                })
              )}
            </div>

            {/* 右カラム：To-Do */}
            <div style={{overflowY:'auto',padding:14,display:'flex',flexDirection:'column',gap:8}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:10,color:'var(--text3)',letterSpacing:'0.18em',textTransform:'uppercase'}}>To-Do — {currentProject}</div>
                {pendingTodos.length>0&&<span style={{background:'rgba(248,224,112,0.18)',border:'1px solid rgba(248,224,112,0.35)',borderRadius:10,padding:'1px 7px',fontSize:10,color:'var(--gold)'}}>{pendingTodos.length}件</span>}
              </div>
              <TodoAddForm onAdd={addTodo} allEntries={entries} currentProject={currentProject}/>
              {pendingTodos.length===0&&doneTodos.length===0?(
                <div style={{textAlign:'center',padding:'24px 8px',color:'var(--text3)',fontSize:12}}>
                  <div style={{fontSize:24,marginBottom:6}}>✓</div>
                  <div>タスクを追加してください</div>
                </div>
              ):(
                <>
                  {pendingTodos.map(t=>(
                    <TodoItem key={t.id} todo={t} onToggle={toggleTodo} onDelete={deleteTodo}
                      onCelebrate={triggerCelebrate} onUpdateTodo={updateTodo} allEntries={entries}/>
                  ))}
                  {doneTodos.length>0&&(
                    <div style={{marginTop:4}}>
                      <button onClick={()=>setShowCompleted(!showCompleted)}
                        style={{background:'none',border:'none',color:'var(--text2)',fontSize:11,padding:'3px 0',cursor:'pointer',width:'100%',textAlign:'left'}}>
                        {showCompleted?'▲':'▼'} 完了済み ({doneTodos.length}件)
                      </button>
                      {showCompleted&&(
                        <div style={{marginTop:5,opacity:0.85}}>
                          {doneTodos.map(t=>(
                            <TodoItem key={t.id} todo={t} onToggle={toggleTodo} onDelete={deleteTodo}
                              onUpdateTodo={updateTodo} allEntries={entries}/>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </div>

          </div>

        </>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);

</script>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>

<script>

const VAPID_KEY = 'BKyFt8gyA_RY0IwZrEvtSONPeYoswxmowJ2EFgtVL-ck95hZsvEKg6DvkXg6NFBw4fYeBPxBO1zYt7d_uURNG8g';

async function initNotifications() {
  try {
    const messaging = firebase.messaging();
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      console.log('通知が拒否されました');
      return;
    }
    const token = await messaging.getToken({ vapidKey: VAPID_KEY });
    console.log('FCMトークン:', token);
    const deviceId = localStorage.getItem('kos_deviceId') || ('dev_' + Date.now());
    localStorage.setItem('kos_deviceId', deviceId);
    await db.collection('fcmTokens').doc(deviceId).set({
      token,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    console.log('通知の準備完了');
  } catch(e) {
    console.warn('通知初期化失敗:', e.message);
  }
}

window.addEventListener('load', () => {
  initNotifications();
});
